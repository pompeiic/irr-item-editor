name: Deploy to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Self-heal: GitHub's Pages deployment queue wedged on 2026-08-06 and a deploy only fires on push or
  # dispatch, so the site stays down until something retries. Each attempt waits ~10 min in the queue
  # (deploy-pages caps the timeout input there), so retry every 15 for near-continuous coverage.
  # Remove once deploys are stable again.
  schedule:
    - cron: "5,20,35,50 * * * *"

permissions:
  contents: read
  pages: write
  id-token: write

# The item export uploads one commit per category file, so a single "Upload Items To GitHub" fires a
# burst of ~14 pushes. Cancel the superseded run so obsolete deployments never queue behind each other;
# deploy-pages cancels its backend Pages deployment on the way out.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v5
        with:
          # Wait ~55 min instead of 10: with the hourly retry above, one deployment is queued almost
          # continuously, so the site republishes the moment GitHub's wedged queue drains.
          timeout: 3300000
