name: Deploy to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Self-heal: GitHub's Pages deployment queue wedged on 2026-08-06 and a deploy only fires on push or
  # dispatch, so the site stays down until something retries. Remove once deploys are stable again.
  schedule:
    - cron: "20 * * * *"

permissions:
  contents: read
  pages: write
  id-token: write

# The item export uploads one commit per category file, so a single "Upload Items To GitHub" fires a
# burst of ~14 pushes. Queue them behind one deploy and drop everything but the newest — cancelling an
# in-flight deploy is what wedged the legacy builder.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
