<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Incursion Red River — Item Database</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0c0c0c;
    --sidebar: #0a0a0a;
    --panel: #101010;
    --panel2: #161616;
    --hover: #1a1a18;
    --border: rgba(232, 228, 216, 0.28);
    --border-strong: rgba(232, 228, 216, 0.55);
    --text: #e8e4d8;
    --dim: #9a9588;
    --faint: #706b5e;
    --accent: #c9b87a;
    --accent-text: #14110a;
    --attention: #d89c56;
    --changed: #c9b87a;
    --danger: #d47868;
    --t1: #9a9588; --t2: #8fbf7f; --t3: #7fa8c9; --t4: #b08fc9;
    --font-ui: "Barlow Condensed", "Segoe UI", sans-serif;
    --font-mono: "IBM Plex Mono", Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html { color-scheme: dark; }
  body { margin: 0; font-family: var(--font-mono); background: var(--bg); color: var(--text); font-size: 13px; overflow: hidden; }
  ::placeholder { color: var(--faint); opacity: 1; }

  /* ---- header ---- */
  header {
    display: flex; align-items: center; gap: 12px; padding: 0 18px; height: 53px;
    background: var(--panel); border-bottom: 1px solid var(--border);
  }
  header h1 { font-family: var(--font-ui); font-size: 18px; font-weight: 600; margin: 0; letter-spacing: 2px; text-transform: uppercase; }
  header h1 small { color: var(--dim); font-size: 12px; letter-spacing: 3px; margin-left: 10px; }
  header .spacer { flex: 1; }
  header input#token { width: 250px; }

  /* ---- generic controls ---- */
  input[type=text], input[type=number], input[type=password], textarea, select {
    background: #0a0a0a; color: var(--text); border: 1px solid var(--border); border-radius: 0;
    padding: 7px 10px; font-size: 12.5px; font-family: var(--font-mono); width: 100%;
  }
  input:focus, textarea:focus, select:focus { outline: none; border-color: var(--accent); }
  input[readonly] { color: var(--dim); background: transparent; cursor: default; }
  input.invalid { border-color: var(--danger); }
  textarea { min-height: 110px; resize: vertical; line-height: 1.5; }
  button {
    background: #0a0a0a; color: var(--text); border: 1px solid var(--border-strong); border-radius: 0;
    padding: 7px 14px; font-size: 12px; cursor: pointer; font-family: var(--font-ui);
    letter-spacing: 1.5px; text-transform: uppercase; font-weight: 600; white-space: nowrap;
  }
  button:hover { border-color: var(--accent); color: var(--accent); }
  button.primary {
    clip-path: polygon(7px 0, 100% 0, 100% calc(100% - 7px), calc(100% - 7px) 100%, 0 100%, 0 7px);
  }
  button.ghost { background: transparent; }
  button.danger { color: var(--danger); border-color: var(--danger); }
  button.small { padding: 4px 10px; font-size: 11px; }
  label { display: block; font-size: 11px; color: var(--dim); margin: 12px 0 4px; text-transform: uppercase; letter-spacing: 1.5px; font-family: var(--font-ui); font-weight: 600; }
  small.hint { color: var(--faint); font-family: var(--font-mono); letter-spacing: 0; text-transform: none; font-weight: 400; }
  .badge { display: inline-flex; align-items: center; justify-content: center; min-width: 17px; height: 16px; padding: 0 5px; font-size: 10.5px; font-weight: 600; font-family: var(--font-mono); border: 1px solid var(--border); }
  .badge.attn { color: var(--attention); border-color: var(--attention); }
  .badge.chg { color: var(--accent); border-color: var(--accent); }

  /* ---- layout ---- */
  main { display: flex; height: calc(100vh - 53px); }
  #sidebar { width: 210px; flex-shrink: 0; background: var(--sidebar); border-right: 1px solid var(--border); overflow-y: auto; padding: 10px; }
  #content { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  #panel { width: 440px; flex-shrink: 0; background: var(--panel); border-left: 1px solid var(--border); display: none; flex-direction: column; }
  #panel.open { display: flex; }

  /* ---- sidebar ---- */
  .side-h { font-family: var(--font-ui); font-size: 11px; color: var(--faint); letter-spacing: 2.5px; text-transform: uppercase; font-weight: 600; margin: 14px 6px 6px; }
  .side-item {
    display: flex; align-items: center; gap: 8px; padding: 5px 9px; cursor: pointer; color: var(--dim);
    font-family: var(--font-ui); font-weight: 600; font-size: 14px; letter-spacing: 1px; text-transform: uppercase;
    border: 1px solid transparent; margin-bottom: 1px;
  }
  .side-item:hover { color: var(--text); border-color: var(--border); }
  .side-item.active { color: var(--accent); background: var(--panel2); border: 1px solid var(--border); }
  .side-item .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .side-item .ct { color: var(--faint); font-size: 11px; font-family: var(--font-mono); letter-spacing: 0; }
  .side-item.child { padding-left: 24px; font-size: 13px; }

  /* ---- content toolbar ---- */
  #toolbar { padding: 12px 16px 8px; border-bottom: 1px solid var(--border); background: var(--bg); }
  #toolbar .trow { display: flex; gap: 8px; align-items: center; }
  #toolbar input#search { flex: 1; min-width: 120px; }
  #toolbar select { width: auto; }
  #countline { color: var(--faint); font-size: 11px; margin-top: 8px; }
  #bulkPanel { display: none; margin-top: 10px; padding: 10px; background: var(--panel2); border: 1px dashed var(--border); }
  #bulkPanel.open { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  #bulkPanel select, #bulkPanel input { width: auto; }
  #bulkPanel .note { color: var(--faint); font-size: 11px; flex-basis: 100%; }

  /* ---- table ---- */
  #tableWrap { flex: 1; overflow-y: auto; }
  table#items { width: 100%; border-collapse: collapse; }
  table#items th {
    position: sticky; top: 0; background: var(--bg); z-index: 1; text-align: left;
    font-family: var(--font-ui); font-size: 11px; color: var(--faint); letter-spacing: 2px; text-transform: uppercase; font-weight: 600;
    padding: 8px 10px; border-bottom: 1px solid var(--border-strong);
  }
  table#items td { padding: 6px 10px; border-bottom: 1px dashed var(--border); vertical-align: middle; }
  table#items tr.irow { cursor: pointer; }
  table#items tr.irow:hover td { background: var(--hover); }
  table#items tr.irow.active td { background: var(--panel2); }
  .cell-item { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .avatar {
    width: 32px; height: 32px; background: var(--panel2); border: 1px dashed var(--border);
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    font-family: var(--font-mono); font-size: 9.5px; font-weight: 600; color: var(--dim);
  }
  .cell-item .nm { font-family: var(--font-ui); font-weight: 600; font-size: 15px; letter-spacing: 1px; text-transform: uppercase; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .cell-item .tg { color: var(--faint); font-size: 10.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; direction: rtl; text-align: left; }
  .cell-item > div { min-width: 0; }
  td.c-cat { color: var(--dim); font-family: var(--font-ui); font-size: 13.5px; letter-spacing: 1px; text-transform: uppercase; }
  td.c-num { font-size: 12px; text-align: right; white-space: nowrap; }
  td.c-upd { color: var(--faint); font-size: 11px; white-space: nowrap; }
  .rchip { display: inline-flex; align-items: center; gap: 6px; font-family: var(--font-ui); font-size: 12.5px; font-weight: 600; letter-spacing: 1px; text-transform: uppercase; white-space: nowrap; }
  .rchip .dot { width: 7px; height: 7px; }
  .stat-badges { display: flex; gap: 5px; }
  .sb { font-family: var(--font-ui); font-size: 10.5px; font-weight: 600; letter-spacing: 1.2px; text-transform: uppercase; padding: 1px 7px; border: 1px solid; white-space: nowrap; }
  .sb.edited { color: var(--accent); border-color: var(--accent); }
  .sb.attn { color: var(--attention); border-color: var(--attention); }
  .sb.note { color: var(--dim); border-color: var(--border); }
  .empty { color: var(--dim); padding: 40px 20px; line-height: 1.7; text-align: center; }

  /* ---- detail panel ---- */
  #panelHead { padding: 14px 16px 0; }
  #panelHead .top { display: flex; align-items: flex-start; gap: 12px; }
  #panelHead .avatar { width: 44px; height: 44px; font-size: 11px; }
  #panelHead .nm { font-family: var(--font-ui); font-size: 19px; font-weight: 600; letter-spacing: 1.5px; text-transform: uppercase; line-height: 1.15; }
  #panelHead .tg { color: var(--faint); font-size: 10.5px; word-break: break-all; margin-top: 2px; }
  #panelHead .meta { margin-top: 5px; display: flex; gap: 10px; align-items: center; }
  #panelHead .meta .cat { color: var(--faint); font-family: var(--font-ui); font-size: 12.5px; letter-spacing: 1.5px; text-transform: uppercase; }
  #panelHead .close { margin-left: auto; cursor: pointer; color: var(--dim); font-size: 15px; padding: 2px 7px; border: 1px solid transparent; }
  #panelHead .close:hover { color: var(--text); border-color: var(--border); }
  #tabs { display: flex; gap: 0; margin-top: 14px; border: 1px solid var(--border-strong); border-bottom: none; }
  .tab {
    flex: 1; text-align: center; padding: 7px 10px; cursor: pointer; color: var(--dim);
    font-family: var(--font-ui); font-weight: 600; font-size: 13px; letter-spacing: 1.5px; text-transform: uppercase;
    display: flex; gap: 6px; align-items: center; justify-content: center; border-bottom: 1px solid var(--border-strong);
  }
  .tab:hover { color: var(--text); }
  .tab.active { color: var(--accent-text); background: var(--accent); border-bottom-color: var(--accent); }
  #panelBody { flex: 1; overflow-y: auto; padding: 4px 16px 16px; }
  #panelFoot { padding: 10px 16px; border-top: 1px solid var(--border); display: flex; gap: 8px; align-items: center; background: var(--panel); }
  #panelFoot .spacer { flex: 1; }
  .sec { font-family: var(--font-ui); font-size: 12px; color: var(--faint); letter-spacing: 2.5px; text-transform: uppercase; font-weight: 600; margin: 18px 0 2px; padding-bottom: 5px; border-bottom: 1px solid var(--border); }
  .row2 { display: flex; gap: 10px; }
  .row2 > div { flex: 1; min-width: 0; }
  table.stats { width: 100%; border-collapse: collapse; margin-top: 8px; }
  table.stats td { padding: 3px 6px 3px 0; vertical-align: middle; }
  table.stats td.sname { width: 42%; color: var(--dim); font-size: 12px; }
  table.stats td.sname .unit { color: var(--faint); font-size: 10px; }
  table.stats td.sval { width: 31%; }
  table.stats td.smod { width: 27%; }
  table.stats select { padding: 5px 6px; font-size: 11.5px; }
  table.stats input { padding: 5px 8px; }
  table.stats tr.modified td.sname { color: var(--changed); }

  /* relations / history */
  .rel-item { display: flex; align-items: center; gap: 9px; padding: 5px 8px; cursor: pointer; border: 1px solid transparent; }
  .rel-item:hover { background: var(--hover); border-color: var(--border); }
  .rel-item .avatar { width: 26px; height: 26px; font-size: 8.5px; }
  .rel-item .nm { font-family: var(--font-ui); font-weight: 600; font-size: 14px; letter-spacing: 1px; text-transform: uppercase; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .rel-item .cat { color: var(--faint); font-size: 10.5px; }
  .tagchips { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 8px; }
  .tagchip { font-size: 10.5px; color: var(--dim); background: var(--panel2); border: 1px dashed var(--border); padding: 2px 7px; }
  .relnote { color: var(--faint); font-size: 11.5px; padding: 8px 2px; line-height: 1.6; }
  .hist { border-left: 1px solid var(--border-strong); margin: 10px 0 0 6px; padding-left: 14px; }
  .hist-e { margin-bottom: 14px; }
  .hist-e .when { color: var(--faint); font-size: 11px; }
  .hist-e .who { color: var(--dim); font-weight: 600; font-size: 11px; }
  .hist-e .lines { margin-top: 3px; font-size: 11.5px; line-height: 1.6; }
  .attn-box { margin-top: 12px; padding: 9px 11px; background: rgba(80, 52, 22, 0.25); border: 1px dashed var(--attention); font-size: 12px; line-height: 1.6; }
  .attn-box .r { color: var(--attention); font-family: var(--font-ui); letter-spacing: 1.5px; text-transform: uppercase; }

  /* ---- changes overlay ---- */
  #overlay { position: fixed; inset: 0; background: rgba(5, 5, 4, 0.75); display: none; z-index: 20; }
  #overlay.open { display: flex; align-items: center; justify-content: center; }
  #overlayCard { width: 640px; max-height: 82vh; background: var(--panel); border: 1px solid var(--border-strong); display: flex; flex-direction: column; }
  #overlayCard .oh { display: flex; align-items: center; padding: 13px 18px; border-bottom: 1px solid var(--border); font-family: var(--font-ui); font-weight: 600; font-size: 15px; letter-spacing: 2px; text-transform: uppercase; }
  #overlayCard .oh .close { margin-left: auto; cursor: pointer; color: var(--dim); padding: 2px 8px; }
  #overlayCard .oh .close:hover { color: var(--text); }
  #diffs { flex: 1; overflow-y: auto; padding: 12px 18px; }
  .diff-item { margin-bottom: 10px; border: 1px dashed var(--border); padding: 9px 12px; background: var(--panel2); }
  .diff-item .dname { font-family: var(--font-ui); font-weight: 600; font-size: 15px; letter-spacing: 1px; text-transform: uppercase; cursor: pointer; }
  .diff-item .dname:hover { color: var(--accent); }
  .diff-item .dline { font-size: 12px; margin-top: 3px; }
  .diff-item .old { color: var(--danger); }
  .diff-item .new { color: var(--changed); }
  #overlayCard .of { display: flex; gap: 8px; padding: 12px 18px; border-top: 1px solid var(--border); }
  #overlayCard .of .spacer { flex: 1; }

  #status {
    position: fixed; bottom: 16px; right: 16px; padding: 10px 16px;
    background: var(--panel2); border: 1px solid var(--border); display: none;
    max-width: 460px; font-size: 12px; white-space: pre-wrap; z-index: 30;
  }
  #status.ok { border-color: var(--accent); }
  #status.err { border-color: var(--danger); }
</style>
</head>
<body>
<header>
  <h1>Item Database<small>Incursion Red River</small></h1>
  <div class="spacer"></div>
  <button id="validateBtn">Validate all</button>
  <button id="changesBtn">Changes <span class="badge chg" id="changesBadge">0</span></button>
  <input type="password" id="token" placeholder="GitHub token" title="Personal access token with read/write Contents on this repo. Stored only in this browser.">
  <button id="saveToken" class="ghost">Remember</button>
</header>
<main>
  <div id="sidebar">
    <div class="side-h">Workspace</div>
    <div id="views"></div>
    <div class="side-h">Categories</div>
    <div id="catList"></div>
  </div>

  <div id="content">
    <div id="toolbar">
      <div class="trow">
        <input type="text" id="search" placeholder="Search name, tag or description… (rel:m4 = items related to matches)">
        <select id="rarityFilter"><option value="All">All rarities</option></select>
        <select id="statCol" title="Which stat the value column shows"></select>
        <select id="sortBy">
          <option value="name">Sort: Name</option>
          <option value="category">Sort: Category</option>
          <option value="rarity">Sort: Rarity</option>
          <option value="priceAsc">Sort: Price ↑</option>
          <option value="priceDesc">Sort: Price ↓</option>
          <option value="statAsc">Sort: Stat column ↑</option>
          <option value="statDesc">Sort: Stat column ↓</option>
          <option value="updated">Sort: Updated</option>
        </select>
        <button id="bulkToggle" class="ghost">Bulk edit</button>
      </div>
      <div id="bulkPanel">
        <select id="bulkStat"></select>
        <select id="bulkOp">
          <option value="mul">Multiply by</option>
          <option value="add">Add</option>
          <option value="set">Set to</option>
        </select>
        <input type="number" id="bulkVal" step="any" placeholder="value" style="width:110px">
        <button id="bulkBtn" class="small">Apply to filtered</button>
        <div class="note">Applies to every listed item that has the chosen stat/price (unsold items with price -1 are only touched by Set). Review in Changes before saving.</div>
      </div>
      <div id="countline"></div>
    </div>
    <div id="tableWrap">
      <table id="items">
        <thead><tr>
          <th style="width:34%">Item</th><th>Category</th><th>Rarity</th>
          <th style="text-align:right">Price</th><th style="text-align:right" id="statColHead">Weight</th>
          <th>Updated</th><th>Status</th>
        </tr></thead>
        <tbody id="rows"></tbody>
      </table>
      <div id="tableEmpty" class="empty" style="display:none"></div>
    </div>
  </div>

  <div id="panel">
    <div id="panelHead"></div>
    <div id="panelBody"></div>
    <div id="panelFoot">
      <button id="discardItemBtn" class="danger ghost small">Discard</button>
      <button id="attnBtn" class="ghost small">⚠ Attention</button>
      <div class="spacer"></div>
      <button id="saveBtn" class="primary">Save changes</button>
    </div>
  </div>
</main>

<div id="overlay">
  <div id="overlayCard">
    <div class="oh">Pending changes<span class="close" id="overlayClose">✕</span></div>
    <div id="diffs"></div>
    <div class="of">
      <button id="revertAllBtn" class="danger ghost">Revert all</button>
      <button id="draftBtn" class="ghost">Copy patch-note draft</button>
      <div class="spacer"></div>
      <button id="commitBtn" class="primary">Commit to GitHub</button>
    </div>
  </div>
</div>
<div id="status"></div>

<script>
const OWNER = "pompeiic", REPO = "irr-item-editor", BRANCH = "main";
const WORKFLOW_FILE = "Workflow.json";
const WEIGHT_TAG = "Inventory.Stats.Weight";

let schema = null;
let cats = [];              // {name, file, doc, baseline}
let workflow = { flags: {}, log: [], notes: {} };
let workflowDirty = false;
let sel = null;             // {c, i}
let activeTab = "overview";
let view = "all";           // all | recent | attention | cat:<Name> | sub:<Name>/<Sub>
let expandedCats = new Set(); // split categories whose children are shown
let statColTag = WEIGHT_TAG;
let ghUser = null;

const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
const leaf = t => { const s = String(t ?? ""); const i = s.lastIndexOf("."); return i >= 0 ? s.slice(i + 1) : s; };
const fmt = v => Number.isFinite(v) ? String(Math.round(v * 10000) / 10000) : String(v);
const clone = o => JSON.parse(JSON.stringify(o));

function status(msg, isErr) {
  const el = $("status");
  el.textContent = msg;
  el.className = isErr ? "err" : "ok";
  el.style.display = "block";
  clearTimeout(el._t);
  el._t = setTimeout(() => el.style.display = "none", 6000);
  return !isErr;
}
function relTime(iso) {
  if (!iso) return "—";
  const s = (Date.now() - new Date(iso).getTime()) / 1000;
  if (!Number.isFinite(s) || s < 0) return "—";
  if (s < 60) return "just now";
  if (s < 3600) return Math.floor(s / 60) + "m ago";
  if (s < 86400) return Math.floor(s / 3600) + "h ago";
  if (s < 86400 * 30) return Math.floor(s / 86400) + "d ago";
  return new Date(iso).toLocaleDateString();
}
const RARITY_COLORS = { "Tier 1": "var(--t1)", "Tier 2": "var(--t2)", "Tier 3": "var(--t3)", "Tier 4": "var(--t4)" };
function rarityChip(tag) {
  if (!tag || tag === "None") return `<span class="rchip" style="color:var(--faint)"><span class="dot" style="background:var(--faint)"></span>None</span>`;
  const l = leaf(tag);
  const col = RARITY_COLORS[l] || "var(--dim)";
  return `<span class="rchip" style="color:${col}"><span class="dot" style="background:${col}"></span>${esc(l)}</span>`;
}
function avatarText(it) {
  const a = (it.abbreviation || it.name || leaf(it.itemTag) || "?").trim();
  return esc(a.slice(0, 4).toUpperCase());
}
function statDesc(tag) { return (schema?.stats || []).find(s => s.tag === tag); }
function statLabel(tag) { const d = statDesc(tag); return (d && d.displayName) ? d.displayName : leaf(tag); }
/* Effect-backed stats (heal over time, stamina boost) are None-modify in-engine — their number lives on
 * the stat's gameplay effect — but they are editable and sortable like any other stat. */
const isEditableStat = s => s.modifyType !== "None" || !!s.effectField;
function findStat(it, tag) { return (it.stats || []).find(x => x.tag === tag && isEditableStat(x)); }
function allEntries() {
  const out = [];
  for (const c of cats) (c.doc.items || []).forEach((it, i) => out.push({ c, i, item: it }));
  return out;
}
function tagMatches(itemTag, supportTag) { return itemTag === supportTag || String(itemTag).startsWith(supportTag + "."); }

/* Broad categories broken down by the next tag segment in the sidebar/table. */
const SPLIT_CATS = new Set(["Attachments", "Weapons", "Provisions"]);
function subCatOf(it, catName) {
  if (!SPLIT_CATS.has(catName)) return null;
  const seg = String(it.itemTag).split(".");
  return seg.length >= 5 ? seg[3] : "Other";
}

// ---- workflow (flags + edit log + notes) --------------------------------------------------------

function flagOf(tag) { return workflow.flags?.[tag]; }
function noteOf(tag) { return workflow.notes?.[tag]?.text || ""; }
function hasAttention(tag) {
  const f = flagOf(tag);
  return !!(f && (f.manual || (f.validation || []).length));
}
function lastEditOf(tag) {
  for (let i = workflow.log.length - 1; i >= 0; i--) if (workflow.log[i].tag === tag) return workflow.log[i];
  return null;
}
function setManualAttention(tag, on) {
  const f = workflow.flags[tag] || (workflow.flags[tag] = { validation: [] });
  f.manual = on;
  f.time = new Date().toISOString();
  if (!on && !(f.validation || []).length) delete workflow.flags[tag];
  workflowDirty = true;
}
function setNote(tag, text) {
  if (text.trim()) workflow.notes[tag] = { text, time: new Date().toISOString(), by: ghUser || "" };
  else delete workflow.notes[tag];
  workflowDirty = true;
}

// ---- validation ---------------------------------------------------------------------------------

/* Canonical caliber spellings, keyed by the digits of both measures ("556x45"). Matched against
 * name/abbreviation/description of every item so ammo, magazines and weapons all follow one form. */
const CALIBERS = {
  "46x30": "4.6x30mm",   "545x39": "5.45x39mm", "556x45": "5.56x45mm",  "57x28": "5.7x28mm",
  "68x51": "6.8x51mm",   "762x25": "7.62x25mm", "762x35": "7.62x35mm",  "762x39": "7.62x39mm",
  "762x51": "7.62x51mm", "762x54": "7.62x54mmR","86x70": "8.6x70mm",    "9x18": "9x18mm",
  "9x19": "9x19mm",      "9x21": "9x21mm",      "9x39": "9x39mm",       "1143x23": "11.43x23mm",
  "127x55": "12.7x55mm", "127x99": "12.7x99mm", "127x108": "12.7x108mm","145x114": "14.5x114mm",
};
function caliberIssues(text) {
  const issues = [];
  const re = /\d[\d.,]{0,4}\s*[x×]\s*\d{1,3}(?:\s*mm)?(?:\s*r\b)?/gi;
  for (const m of String(text || "").matchAll(re)) {
    const raw = m[0].trim();
    const parts = raw.toLowerCase().split(/[x×]/);
    const key = parts[0].replace(/\D/g, "") + "x" + parts[1].replace(/\D/g, "");
    const canonical = CALIBERS[key];
    if (canonical && raw !== canonical) issues.push(`"${raw}" should be "${canonical}"`);
  }
  return issues;
}

const VALIDATION_RULES = [
  { id: "name", check: it => !String(it.name || "").trim() ? "Name is empty"
      : /template|tooltip/i.test(it.name) ? "Name contains placeholder text" : null },
  { id: "description", check: it => {
      const d = String(it.description || "");
      if (!d.trim()) return "Description is empty";
      if (/template|tooltip/i.test(d)) return "Description contains placeholder text (template/tooltip)";
      if (d.trim().length < 15) return "Description is very short";
      return null; } },
  { id: "abbreviation", check: it => !String(it.abbreviation || "").trim() ? "Abbreviation is empty"
      : String(it.abbreviation).length > 12 ? "Abbreviation longer than 12 characters" : null },
  { id: "caliber", check: it => {
      const issues = [
        ...caliberIssues(it.name).map(s => `Caliber in name: ${s}`),
        ...caliberIssues(it.abbreviation).map(s => `Caliber in abbreviation: ${s}`),
        ...caliberIssues(it.description).map(s => `Caliber in description: ${s}`),
      ];
      return issues.length ? issues.join("; ") : null; } },
  { id: "price", check: it => it.vendor?.bHasVendorRow && it.vendor.defaultMarketPrice === 0 ? "Sold item with price 0" : null },
  { id: "rarity", check: it => it.vendor?.bHasVendorRow && (!it.vendor.rarityTag || it.vendor.rarityTag === "None") ? "No rarity set" : null },
];

function validateAll() {
  let flagged = 0;
  for (const e of allEntries()) {
    const reasons = VALIDATION_RULES.map(r => r.check(e.item)).filter(Boolean);
    const f = flagOf(e.item.itemTag);
    if (reasons.length) {
      const nf = f || (workflow.flags[e.item.itemTag] = {});
      nf.validation = reasons;
      nf.time = new Date().toISOString();
      flagged++;
    } else if (f) {
      f.validation = [];
      if (!f.manual) delete workflow.flags[e.item.itemTag];
    }
  }
  workflowDirty = true;
  renderAll();
  status(`Validation: ${flagged} item(s) need attention. Flags are saved with the next commit.`);
}

// ---- diffing ------------------------------------------------------------------------------------

function entryDiff(base, cur) {
  if (!base) return [];
  const lines = [];
  const txt = (label, a, b) => { if ((a ?? "") !== (b ?? "")) lines.push({ label, old: a, new: b, text: label === "Description" }); };
  txt("Name", base.name, cur.name);
  txt("Abbreviation", base.abbreviation, cur.abbreviation);
  txt("Description", base.description, cur.description);
  const bs = base.stats || [], cs = cur.stats || [];
  for (let i = 0; i < Math.min(bs.length, cs.length); i++) {
    if (bs[i].value !== cs[i].value) lines.push({ label: statLabel(cs[i].tag), old: fmt(bs[i].value), new: fmt(cs[i].value) });
    if (bs[i].modifyType !== cs[i].modifyType) lines.push({ label: statLabel(cs[i].tag) + " modify", old: bs[i].modifyType, new: cs[i].modifyType });
    if (bs[i].effectDuration !== cs[i].effectDuration) lines.push({ label: statLabel(cs[i].tag) + " duration", old: fmt(bs[i].effectDuration) + "s", new: fmt(cs[i].effectDuration) + "s" });
  }
  if ((base.maxStack ?? null) !== (cur.maxStack ?? null)) lines.push({ label: "Max stack", old: String(base.maxStack), new: String(cur.maxStack) });
  if (base.vendor && cur.vendor && base.vendor.bHasVendorRow) {
    const v = (label, a, b, isTag) => { if (a !== b) lines.push({ label, old: isTag ? leaf(a) : fmt(a), new: isTag ? leaf(b) : fmt(b) }); };
    v("Rarity", base.vendor.rarityTag, cur.vendor.rarityTag, true);
    v("Faction", base.vendor.factionTag, cur.vendor.factionTag, true);
    v("Price", base.vendor.defaultMarketPrice, cur.vendor.defaultMarketPrice);
    v("Black market", base.vendor.blackMarketPrice, cur.vendor.blackMarketPrice);
  }
  return lines;
}
function catChanges(c) {
  const out = [];
  (c.doc.items || []).forEach((it, i) => {
    const lines = entryDiff(c.baseline[i], it);
    if (lines.length) out.push({ c, i, item: it, lines });
  });
  return out;
}
function allChanges() { return cats.flatMap(catChanges); }

// ---- filtering / sorting ------------------------------------------------------------------------

function visibleEntries() {
  const q = $("search").value.trim().toLowerCase();
  const rarity = $("rarityFilter").value;
  let out = allEntries();

  if (view === "attention") out = out.filter(e => hasAttention(e.item.itemTag));
  else if (view === "recent") {
    const seen = new Map();
    workflow.log.forEach(l => seen.set(l.tag, l.time));
    allChanges().forEach(ch => seen.set(ch.item.itemTag, "9999")); // unsaved edits float to top
    out = out.filter(e => seen.has(e.item.itemTag));
    out.sort((a, b) => String(seen.get(b.item.itemTag)).localeCompare(String(seen.get(a.item.itemTag))));
  }
  else if (view.startsWith("cat:")) { const c = view.slice(4); out = out.filter(e => e.c.name === c); }
  else if (view.startsWith("sub:")) { const k = view.slice(4); out = out.filter(e => e.c.name + "/" + (subCatOf(e.item, e.c.name) || "") === k); }

  if (q) {
    const rel = q.match(/^rel:\s*(.+)$/);
    if (rel) {
      // rel:<text> — items related (either direction) to any item matching <text> by name or tag.
      const rq = rel[1];
      const targets = allEntries().filter(t =>
        String(t.item.name).toLowerCase().includes(rq) || String(t.item.itemTag).toLowerCase().includes(rq));
      const targetItems = new Set(targets.map(t => t.item));
      out = out.filter(e => !targetItems.has(e.item) && targets.some(t =>
        (e.item.supportedItemTags || []).some(tag => tagMatches(t.item.itemTag, tag)) ||
        (t.item.supportedItemTags || []).some(tag => tagMatches(e.item.itemTag, tag))));
    } else {
      out = out.filter(e =>
        String(e.item.name).toLowerCase().includes(q) ||
        String(e.item.itemTag).toLowerCase().includes(q) ||
        String(e.item.description || "").toLowerCase().includes(q) ||
        (e.item.supportedItemTags || []).some(t => t.toLowerCase().includes(q)));
    }
  }
  if (rarity !== "All") out = out.filter(e => e.item.vendor?.rarityTag === rarity);

  if (view !== "recent") {
    const sort = $("sortBy").value;
    const nameOf = e => String(e.item.name || leaf(e.item.itemTag)).toLowerCase();
    const rarityOf = e => e.item.vendor?.bHasVendorRow && e.item.vendor.rarityTag !== "None" ? leaf(e.item.vendor.rarityTag) : "\uffff";
    const priceOf = e => e.item.vendor?.bHasVendorRow ? e.item.vendor.defaultMarketPrice : -1;
    const statOf = (e, missing) => { const s = findStat(e.item, statColTag); return s ? s.value : missing; };
    const updOf = e => lastEditOf(e.item.itemTag)?.time || "";
    out.sort((a, b) => {
      if (sort === "category") return a.c.name.localeCompare(b.c.name) || nameOf(a).localeCompare(nameOf(b));
      if (sort === "rarity") return rarityOf(a).localeCompare(rarityOf(b)) || nameOf(a).localeCompare(nameOf(b));
      if (sort === "priceAsc") return priceOf(a) - priceOf(b) || nameOf(a).localeCompare(nameOf(b));
      if (sort === "priceDesc") return priceOf(b) - priceOf(a) || nameOf(a).localeCompare(nameOf(b));
      if (sort === "statAsc") return statOf(a, Infinity) - statOf(b, Infinity) || nameOf(a).localeCompare(nameOf(b));
      if (sort === "statDesc") return statOf(b, -Infinity) - statOf(a, -Infinity) || nameOf(a).localeCompare(nameOf(b));
      if (sort === "updated") return updOf(b).localeCompare(updOf(a)) || nameOf(a).localeCompare(nameOf(b));
      return nameOf(a).localeCompare(nameOf(b));
    });
  }
  return out;
}

// ---- sidebar ------------------------------------------------------------------------------------

function renderSidebar() {
  const attnCount = allEntries().filter(e => hasAttention(e.item.itemTag)).length;
  const recentCount = new Set(workflow.log.map(l => l.tag)).size;
  const views = [
    { id: "all", nm: "All items", ct: allEntries().length },
    { id: "recent", nm: "Recently edited", ct: recentCount || "" },
    { id: "attention", nm: "Needs attention", ct: attnCount ? `<span class="badge attn">${attnCount}</span>` : "" },
  ];
  $("views").innerHTML = views.map(v =>
    `<div class="side-item${view === v.id ? " active" : ""}" data-view="${v.id}"><span class="nm">${v.nm}</span><span class="ct">${v.ct}</span></div>`).join("");
  let catHtml = "";
  for (const c of cats) {
    const split = SPLIT_CATS.has(c.name);
    const open = expandedCats.has(c.name);
    const arrow = split ? `<span style="color:var(--faint);margin-right:2px">${open ? "▾" : "▸"}</span>` : "";
    catHtml += `<div class="side-item${view === "cat:" + c.name ? " active" : ""}" data-view="cat:${esc(c.name)}"${split ? ' data-split="1"' : ""}><span class="nm">${arrow}${esc(c.name)}</span><span class="ct">${(c.doc.items || []).length}</span></div>`;
    if (split && open) {
      const subs = new Map();
      for (const it of c.doc.items || []) {
        const s = subCatOf(it, c.name);
        subs.set(s, (subs.get(s) || 0) + 1);
      }
      for (const s of [...subs.keys()].sort()) {
        const key = c.name + "/" + s;
        catHtml += `<div class="side-item child${view === "sub:" + key ? " active" : ""}" data-view="sub:${esc(key)}"><span class="nm">${esc(s)}</span><span class="ct">${subs.get(s)}</span></div>`;
      }
    }
  }
  $("catList").innerHTML = catHtml;
  document.querySelectorAll(".side-item").forEach(el => el.onclick = () => {
    const v = el.dataset.view;
    if (el.dataset.split) {
      // First click selects + expands; clicking the already-active parent again collapses.
      const name = v.slice(4);
      if (view === v && expandedCats.has(name)) expandedCats.delete(name);
      else expandedCats.add(name);
    }
    view = v;
    renderAll();
  });
}

// ---- table --------------------------------------------------------------------------------------

function renderTable() {
  const entries = visibleEntries();
  const changes = allChanges();
  $("changesBadge").textContent = changes.length;
  $("countline").textContent = `${entries.length} of ${allEntries().length} items` + (changes.length ? ` · ${changes.length} with unsaved changes` : "");
  $("statColHead").textContent = statLabel(statColTag);

  const tb = $("rows");
  tb.innerHTML = "";
  $("tableEmpty").style.display = entries.length ? "none" : "block";
  $("tableEmpty").textContent = "No items match.";
  const d = statDesc(statColTag);
  const unit = d?.unit ? " " + d.unit : "";
  for (const e of entries) {
    const it = e.item;
    const changed = entryDiff(e.c.baseline[e.i], it).length > 0;
    const attn = hasAttention(it.itemTag);
    const note = !!noteOf(it.itemTag);
    const s = findStat(it, statColTag);
    const last = lastEditOf(it.itemTag);
    const price = it.vendor?.bHasVendorRow && it.vendor.defaultMarketPrice >= 0 ? fmt(it.vendor.defaultMarketPrice) : "—";
    const tr = document.createElement("tr");
    tr.className = "irow" + (sel && sel.c === e.c && sel.i === e.i ? " active" : "");
    tr.innerHTML =
      `<td><div class="cell-item"><div class="avatar">${avatarText(it)}</div><div>` +
        `<div class="nm">${esc(it.name || leaf(it.itemTag))}</div>` +
        `<div class="tg" title="${esc(it.itemTag)}">${esc(it.itemTag)}</div></div></div></td>` +
      `<td class="c-cat">${esc(e.c.name)}${(sub => sub ? ` <span style="color:var(--faint)">/ ${esc(sub)}</span>` : "")(subCatOf(it, e.c.name))}</td>` +
      `<td>${rarityChip(it.vendor?.bHasVendorRow ? it.vendor.rarityTag : null)}</td>` +
      `<td class="c-num">${esc(price)}</td>` +
      `<td class="c-num">${s ? esc(fmt(s.value)) + esc(unit) : "—"}</td>` +
      `<td class="c-upd">${changed ? "unsaved" : relTime(last?.time)}</td>` +
      `<td><div class="stat-badges">${changed ? '<span class="sb edited">Edited</span>' : ""}${attn ? '<span class="sb attn">Attention</span>' : ""}${note ? '<span class="sb note">Note</span>' : ""}</div></td>`;
    tr.onclick = () => { sel = { c: e.c, i: e.i }; activeTab = activeTab || "overview"; renderPanel(); renderTable(); };
    tb.appendChild(tr);
  }
}

// ---- detail panel -------------------------------------------------------------------------------

function tagSelect(id, options, current) {
  const opts = [...new Set(["None", ...(options || []), current].filter(Boolean))];
  return `<select id="${id}">` + opts.map(o => `<option value="${esc(o)}"${o === current ? " selected" : ""}>${esc(o === "None" ? "None" : leaf(o))}</option>`).join("") + `</select>`;
}

function renderPanel() {
  const panel = $("panel");
  if (!sel) { panel.classList.remove("open"); return; }
  panel.classList.add("open");
  const it = sel.c.doc.items[sel.i];

  const rel = relationsOf(it);
  $("panelHead").innerHTML =
    `<div class="top"><div class="avatar">${avatarText(it)}</div><div style="min-width:0;flex:1">` +
      `<div class="nm">${esc(it.name || leaf(it.itemTag))}</div>` +
      `<div class="tg">${esc(it.itemTag)}</div>` +
      `<div class="meta">${rarityChip(it.vendor?.bHasVendorRow ? it.vendor.rarityTag : null)}<span class="cat">${esc(sel.c.name)}</span></div>` +
    `</div><span class="close" id="panelClose">✕</span></div>` +
    `<div id="tabs">` +
      `<div class="tab${activeTab === "overview" ? " active" : ""}" data-tab="overview">Overview</div>` +
      `<div class="tab${activeTab === "relations" ? " active" : ""}" data-tab="relations">Relations</div>` +
      `<div class="tab${activeTab === "history" ? " active" : ""}" data-tab="history">History</div>` +
    `</div>`;
  $("panelClose").onclick = () => { sel = null; renderPanel(); renderTable(); };
  document.querySelectorAll(".tab").forEach(el => el.onclick = () => { activeTab = el.dataset.tab; renderPanel(); });

  if (activeTab === "overview") renderOverview(it);
  else if (activeTab === "relations") renderRelations(it, rel);
  else renderHistory(it);

  const f = flagOf(it.itemTag);
  $("attnBtn").style.color = f?.manual ? "var(--attention)" : "";
  $("attnBtn").style.borderColor = f?.manual ? "var(--attention)" : "";
}

function renderOverview(it) {
  const modifyTypes = (schema?.modifyTypes || ["None", "Base", "Add", "Multiply"]).filter(m => m !== "None");
  let html = "";

  const f = flagOf(it.itemTag);
  if (f && (f.validation || []).length)
    html += `<div class="attn-box"><b class="r">⚠ Needs attention</b><br>${f.validation.map(esc).join("<br>")}</div>`;

  html += `<div class="sec">Identity</div>`;
  html += `<label>Item tag — read-only</label><input type="text" readonly value="${esc(it.itemTag)}">`;
  html += `<div class="row2"><div><label>Vendor row — read-only</label><input type="text" readonly value="${esc(it.vendor?.bHasVendorRow ? it.vendor.rowName : "(none)")}"></div>` +
          `<div><label>Asset — read-only</label><input type="text" readonly title="${esc(it.assetPath)}" value="${esc(String(it.assetPath || "").split("/").pop())}"></div></div>`;

  html += `<div class="sec">Text</div>`;
  html += `<label>Display name</label><input type="text" id="fName" value="${esc(it.name)}">`;
  html += `<label>Abbreviation — <small class="hint">inventory tile, keep short</small></label><input type="text" id="fAbbr" maxlength="24" value="${esc(it.abbreviation)}">`;
  html += `<label>Description</label><textarea id="fDesc">${esc(it.description)}</textarea>`;

  html += `<div class="sec">Quick balance</div>`;
  if (it.vendor?.bHasVendorRow) {
    html += `<div class="row2"><div><label>Price — <small class="hint">-1 = not sold</small></label><input type="number" step="any" id="fPrice" value="${esc(it.vendor.defaultMarketPrice)}"></div>` +
            `<div><label>Black market — <small class="hint">-1 = not sold</small></label><input type="number" step="any" id="fBlackPrice" value="${esc(it.vendor.blackMarketPrice)}"></div></div>`;
    html += `<div class="row2"><div><label>Rarity</label>${tagSelect("fRarity", schema?.rarityTags, it.vendor.rarityTag)}</div>` +
            `<div><label>Faction — <small class="hint">None = can't be bought</small></label>${tagSelect("fFaction", schema?.factionTags, it.vendor.factionTag)}</div></div>`;
  }
  const stackHint = it.bCanStack === false ? ` — <small class="hint">item is not stackable</small>` : "";
  html += `<div class="row2"><div><label>Max stack${stackHint}</label><input type="number" step="1" id="fMaxStack" value="${esc(it.maxStack ?? "")}"${it.maxStack === undefined ? " readonly" : ""}></div><div></div></div>`;

  html += `<div class="sec">Stats</div>`;
  const editableStats = (it.stats || []).map((s, si) => ({ s, si })).filter(x => isEditableStat(x.s));
  if (!editableStats.length) html += `<div class="empty" style="padding:16px">No editable stats.</div>`;
  else {
    html += `<table class="stats">`;
    for (const { s, si } of editableStats) {
      const d = statDesc(s.tag);
      const b = sel.c.baseline[sel.i].stats[si];
      const eff = !!s.effectField;
      const changed = b && (b.value !== s.value || b.modifyType !== s.modifyType || b.effectDuration !== s.effectDuration);
      // A ticking effect's value is per tick, so spell out what it adds up to over the full duration.
      const total = eff && s.effectTickInterval > 0 && s.effectDuration > 0
        ? `<br><small class="hint">≈ ${esc(fmt(s.value * (s.effectDuration / s.effectTickInterval)))}${d?.unit ? " " + esc(d.unit) : ""} over ${esc(fmt(s.effectDuration))}s</small>`
        : "";
      // Third column carries the effect's duration where a plain stat carries its modify type.
      const trailing = eff
        ? (s.effectDuration >= 0
            ? `<input type="number" step="any" min="0" data-stat="${si}" data-field="effectDuration" value="${esc(s.effectDuration)}" title="Effect duration in seconds">`
            : `<small class="hint">no duration</small>`)
        : `<select data-stat="${si}" data-field="modifyType">` +
            modifyTypes.map(m => `<option value="${esc(m)}"${m === s.modifyType ? " selected" : ""}>${esc(m)}</option>`).join("") +
          `</select>`;
      html += `<tr class="${changed ? "modified" : ""}" title="${esc(s.tag)}${eff ? " — gameplay effect" : ""}">` +
        `<td class="sname">${esc(statLabel(s.tag))}${d?.unit ? ` <span class="unit">[${esc(d.unit)}]</span>` : ""}${total}</td>` +
        `<td class="sval"><input type="number" step="any" data-stat="${si}" data-field="value" value="${esc(s.value)}"></td>` +
        `<td class="smod">${trailing}</td></tr>`;
    }
    html += `</table>`;
  }

  html += `<div class="sec">Notes</div>`;
  const n = workflow.notes?.[it.itemTag];
  html += `<label>Shared between editors — <small class="hint">saved with the next commit, never imported into the game</small></label>`;
  html += `<textarea id="fNote" style="min-height:70px" placeholder="e.g. rebalance after next playtest…">${esc(noteOf(it.itemTag))}</textarea>`;
  if (n?.time) html += `<small class="hint">Last edited ${esc(relTime(n.time))}${n.by ? " by " + esc(n.by) : ""}</small>`;

  $("panelBody").innerHTML = html;

  // wiring
  const num = inp => { const v = parseFloat(inp.value); inp.classList.toggle("invalid", !Number.isFinite(v)); return v; };
  $("fName").oninput = e => { it.name = e.target.value; onEdit(); };
  $("fAbbr").oninput = e => { it.abbreviation = e.target.value; onEdit(); };
  $("fDesc").oninput = e => { it.description = e.target.value; onEdit(); };
  $("fNote").oninput = e => { setNote(it.itemTag, e.target.value); };
  $("fNote").onblur = () => renderTable();
  if (it.maxStack !== undefined) $("fMaxStack").oninput = e => { const v = parseInt(e.target.value, 10); if (Number.isFinite(v) && v >= 1) it.maxStack = v; onEdit(); };
  document.querySelectorAll("#panelBody [data-stat]").forEach(inp => inp.oninput = e => {
    const s = it.stats[+e.target.dataset.stat];
    const field = e.target.dataset.field;
    if (field === "value") { const v = num(e.target); if (Number.isFinite(v)) s.value = v; }
    else if (field === "effectDuration") { const v = num(e.target); if (Number.isFinite(v) && v >= 0) s.effectDuration = v; }
    else s.modifyType = e.target.value;
    onEdit();
  });
  if (it.vendor?.bHasVendorRow) {
    $("fRarity").oninput = e => { it.vendor.rarityTag = e.target.value; onEdit(); };
    $("fFaction").oninput = e => { it.vendor.factionTag = e.target.value; onEdit(); };
    $("fPrice").oninput = e => { const v = num(e.target); if (Number.isFinite(v)) it.vendor.defaultMarketPrice = v; onEdit(); };
    $("fBlackPrice").oninput = e => { const v = num(e.target); if (Number.isFinite(v)) it.vendor.blackMarketPrice = v; onEdit(); };
  }
}

/* Relations, with generic-container handling: a container that accepts a large share of the whole
 * database (backpacks, rigs, cases) lists nothing — and doesn't show up in other items' "fits into". */
function relationsOf(it) {
  const all = allEntries();
  const genericThreshold = Math.max(40, all.length * 0.25);
  const acceptCount = e => all.reduce((n, o) => n + (o.item !== e && (e.supportedItemTags || []).some(t => tagMatches(o.item.itemTag, t)) ? 1 : 0), 0);
  const accepts = all.filter(e => e.item !== it && (it.supportedItemTags || []).some(t => tagMatches(e.item.itemTag, t)));
  const generic = accepts.length > genericThreshold;
  const fitsAll = all.filter(e => e.item !== it && (e.item.supportedItemTags || []).some(t => tagMatches(it.itemTag, t)));
  const fitsSpecific = [], fitsGeneric = [];
  for (const e of fitsAll) (acceptCount(e.item) > genericThreshold ? fitsGeneric : fitsSpecific).push(e);
  return { accepts, generic, fitsSpecific, fitsGeneric, total: all.length };
}

function relList(entries, cap) {
  if (!entries.length) return `<div class="empty" style="padding:12px">None.</div>`;
  let html = entries.slice(0, cap).map(e =>
    `<div class="rel-item" data-tag="${esc(e.item.itemTag)}"><div class="avatar">${avatarText(e.item)}</div>` +
    `<span class="nm">${esc(e.item.name || leaf(e.item.itemTag))}</span><span class="cat">${esc(e.c.name)}</span></div>`).join("");
  if (entries.length > cap) html += `<div class="empty" style="padding:8px">+ ${entries.length - cap} more…</div>`;
  return html;
}

function renderRelations(it, rel) {
  let html = `<div style="margin-top:12px"><button id="relSearchBtn" class="small ghost">Search related in list</button></div>`;
  if (rel.generic) {
    html += `<div class="sec">Accepts</div>`;
    html += `<div class="relnote">Generic storage — accepts ${rel.accepts.length} of ${rel.total} items, so they aren't listed. Supported tag groups:</div>`;
    html += `<div class="tagchips">${(it.supportedItemTags || []).map(t => `<span class="tagchip">${esc(t)}</span>`).join("")}</div>`;
  } else {
    html += `<div class="sec">Accepts (${rel.accepts.length}) — <small class="hint">items this item's containers support</small></div>`;
    html += relList(rel.accepts, 60);
  }
  html += `<div class="sec">Fits into (${rel.fitsSpecific.length}) — <small class="hint">items whose containers support this item</small></div>`;
  html += relList(rel.fitsSpecific, 60);
  if (rel.fitsGeneric.length)
    html += `<div class="relnote">+ fits into ${rel.fitsGeneric.length} generic storage item(s) (backpacks, rigs, cases) — not listed.</div>`;
  html += `<div class="relnote">Relations are read-only — container setup is edited in Unreal.</div>`;
  $("panelBody").innerHTML = html;
  $("relSearchBtn").onclick = () => {
    $("search").value = "rel:" + it.itemTag;
    view = "all";
    renderAll();
  };
  document.querySelectorAll(".rel-item").forEach(el => el.onclick = () => {
    const t = el.dataset.tag;
    for (const e of allEntries()) if (e.item.itemTag === t) { sel = { c: e.c, i: e.i }; activeTab = "overview"; renderPanel(); renderTable(); return; }
  });
}

function renderHistory(it) {
  let html = "";
  const pending = entryDiff(sel.c.baseline[sel.i], it);
  if (pending.length) {
    html += `<div class="sec">Unsaved changes</div><div class="hist"><div class="hist-e"><div class="lines">` +
      pending.map(l => l.text ? `${esc(l.label)} <span class="new">updated</span>`
        : `${esc(l.label)} <span class="old">${esc(l.old)}</span> → <span class="new">${esc(l.new)}</span>`).join("<br>") +
      `</div></div></div>`;
  }
  const entries = workflow.log.filter(l => l.tag === it.itemTag).slice().reverse();
  html += `<div class="sec">History</div>`;
  if (!entries.length) html += `<div class="empty" style="padding:16px">No recorded edits yet.<br><small class="hint">History starts with the first commit made from this editor.</small></div>`;
  else {
    html += `<div class="hist">` + entries.map(l =>
      `<div class="hist-e"><span class="who">${esc(l.author || "unknown")}</span> <span class="when">· ${esc(relTime(l.time))} (${esc(new Date(l.time).toLocaleString())})</span>` +
      `<div class="lines">${(l.lines || []).map(esc).join("<br>")}</div></div>`).join("") + `</div>`;
  }
  $("panelBody").innerHTML = html;
}

function onEdit() { renderTable(); renderSidebar(); }

// ---- bulk edit ----------------------------------------------------------------------------------

$("bulkToggle").onclick = () => $("bulkPanel").classList.toggle("open");
function renderBulk() {
  $("bulkStat").innerHTML =
    `<option value="__price">Price (market)</option><option value="__blackmarket">Price (black market)</option>` +
    (schema?.stats || []).map(s => `<option value="${esc(s.tag)}">${esc(s.displayName || leaf(s.tag))}</option>`).join("");
}
$("bulkBtn").onclick = () => {
  const tag = $("bulkStat").value, op = $("bulkOp").value, val = parseFloat($("bulkVal").value);
  if (!tag) return status("Pick a stat.", true);
  if (!Number.isFinite(val)) return status("Bulk value is not a number.", true);
  let touched = 0;
  const isPrice = tag === "__price" || tag === "__blackmarket";
  for (const e of visibleEntries()) {
    if (isPrice) {
      const v = e.item.vendor;
      if (!v?.bHasVendorRow) continue;
      const cur = tag === "__price" ? v.defaultMarketPrice : v.blackMarketPrice;
      // -1 = not sold: scale/offset never turns an unsold item into a sold one; only Set does.
      if (op !== "set" && !(cur >= 0)) continue;
      const nv = op === "set" ? val : op === "add" ? cur + val : cur * val;
      const r = Math.round(nv * 100) / 100;
      if (tag === "__price") v.defaultMarketPrice = r; else v.blackMarketPrice = r;
    } else {
      const s = findStat(e.item, tag);
      if (!s) continue;
      const nv = op === "set" ? val : op === "add" ? s.value + val : s.value * val;
      s.value = Math.round(nv * 10000) / 10000;
    }
    touched++;
  }
  renderAll();
  const label = tag === "__price" ? "Price" : tag === "__blackmarket" ? "Black market price" : statLabel(tag);
  status(`Bulk: ${label} ${op} ${val} applied to ${touched} item(s). Review in Changes before committing.`);
};

// ---- patch-note draft ---------------------------------------------------------------------------

$("draftBtn").onclick = () => {
  const changes = allChanges();
  if (!changes.length) return status("No changes to draft.", true);
  const lines = changes.map(ch => `- **${ch.item.name || leaf(ch.item.itemTag)}**: ` +
    ch.lines.map(l => l.text ? `${l.label} updated` : `${l.label} ${l.old} → ${l.new}`).join(", "));
  navigator.clipboard.writeText(lines.join("\n"));
  status("Patch-note draft copied (" + changes.length + " item lines).");
};

// ---- overlay / revert / commit ------------------------------------------------------------------

function openOverlay() {
  const el = $("diffs");
  const changes = allChanges();
  el.innerHTML = changes.length ? "" : '<div class="empty">No changes yet.</div>';
  for (const ch of changes) {
    const div = document.createElement("div");
    div.className = "diff-item";
    div.innerHTML = `<div class="dname">${esc(ch.item.name || leaf(ch.item.itemTag))}</div>` +
      ch.lines.map(l => l.text
        ? `<div class="dline">${esc(l.label)} <span class="new">updated</span></div>`
        : `<div class="dline">${esc(l.label)} <span class="old">${esc(l.old)}</span> → <span class="new">${esc(l.new)}</span></div>`).join("");
    div.querySelector(".dname").onclick = () => { sel = { c: ch.c, i: ch.i }; activeTab = "overview"; closeOverlay(); renderPanel(); renderTable(); };
    el.appendChild(div);
  }
  $("overlay").classList.add("open");
}
function closeOverlay() { $("overlay").classList.remove("open"); }
$("changesBtn").onclick = openOverlay;
$("overlayClose").onclick = closeOverlay;
$("overlay").onclick = e => { if (e.target === $("overlay")) closeOverlay(); };
document.addEventListener("keydown", e => {
  if (e.key !== "Escape") return;
  if ($("overlay").classList.contains("open")) closeOverlay();
  else if (sel) { sel = null; renderPanel(); renderTable(); }
});

$("revertAllBtn").onclick = () => {
  if (!allChanges().length) return;
  if (!confirm("Discard ALL unsaved changes?")) return;
  for (const c of cats) c.doc.items = clone(c.baseline);
  sel = null;
  closeOverlay();
  renderAll();
  status("All changes reverted.");
};
$("discardItemBtn").onclick = () => {
  if (!sel) return;
  sel.c.doc.items[sel.i] = clone(sel.c.baseline[sel.i]);
  renderPanel(); renderTable(); renderSidebar();
};
$("attnBtn").onclick = () => {
  if (!sel) return;
  const tag = sel.c.doc.items[sel.i].itemTag;
  setManualAttention(tag, !(flagOf(tag)?.manual));
  renderPanel(); renderTable(); renderSidebar();
  status(flagOf(tag)?.manual ? "Marked as needs attention (saved with next commit)." : "Attention flag cleared (saved with next commit).");
};

async function ghFetchUser(headers) {
  if (ghUser) return ghUser;
  try {
    const res = await fetch("https://api.github.com/user", { headers });
    if (res.ok) ghUser = (await res.json()).login;
  } catch (e) { /* offline lookups just fall back */ }
  return ghUser || "unknown";
}

async function putFile(path, contentObj, headers, message) {
  const api = `https://api.github.com/repos/${OWNER}/${REPO}/contents/${path}`;
  const cur = await fetch(api + "?ref=" + BRANCH, { headers });
  let sha = undefined;
  if (cur.ok) sha = (await cur.json()).sha;
  else if (cur.status === 401) throw new Error("GitHub rejected the token (401) — expired or pasted incompletely.");
  else if (cur.status !== 404) throw new Error(path + ": fetching current file failed: " + cur.status);
  const body = {
    message,
    content: btoa(unescape(encodeURIComponent(JSON.stringify(contentObj, null, "\t")))),
    branch: BRANCH
  };
  if (sha) body.sha = sha;
  const put = await fetch(api, { method: "PUT", headers, body: JSON.stringify(body) });
  if (!put.ok) throw new Error(path + ": commit failed: " + put.status + " " + (await put.text()).slice(0, 200));
}

async function commit() {
  const dirty = cats.filter(c => catChanges(c).length);
  if (!dirty.length && !workflowDirty) return status("Nothing to save.", true);
  const token = $("token").value.trim();
  if (!token) return status("Paste a GitHub token first (top right).", true);
  const headers = { "Authorization": "Bearer " + token, "Accept": "application/vnd.github+json" };
  const author = await ghFetchUser(headers);
  let committed = 0;
  try {
    // Log entries reflect exactly what this commit changes.
    const now = new Date().toISOString();
    const newLog = allChanges().map(ch => ({
      tag: ch.item.itemTag, time: now, author,
      lines: ch.lines.map(l => l.text ? `${l.label} updated` : `${l.label} ${l.old} → ${l.new}`)
    }));

    for (const c of dirty) {
      await putFile(c.file, c.doc, headers, `Update ${c.file} (item editor)`);
      c.baseline = clone(c.doc.items);
      committed++;
    }
    if (newLog.length || workflowDirty) {
      workflow.log.push(...newLog);
      if (workflow.log.length > 5000) workflow.log = workflow.log.slice(-5000);
      await putFile(WORKFLOW_FILE, workflow, headers, "Update workflow (item editor)");
      workflowDirty = false;
    }
    renderAll();
    status(`Saved: ${committed} file(s) committed${newLog.length ? `, ${newLog.length} history entrie(s)` : ""}. Import in Unreal via Download + Import.`);
  } catch (e) {
    renderAll();
    status(e.message + (committed ? ` (${committed} file(s) already committed)` : ""), true);
  }
}
$("commitBtn").onclick = () => { commit(); closeOverlay(); };
$("saveBtn").onclick = commit;
$("validateBtn").onclick = validateAll;

// ---- load ---------------------------------------------------------------------------------------

function renderAll() { renderSidebar(); renderTable(); renderPanel(); }

function renderStatColSelect() {
  const stats = (schema?.stats || []).slice().sort((a, b) => String(a.displayName || leaf(a.tag)).localeCompare(String(b.displayName || leaf(b.tag))));
  const el = $("statCol");
  el.innerHTML = stats.map(s => `<option value="${esc(s.tag)}"${s.tag === statColTag ? " selected" : ""}>Col: ${esc(s.displayName || leaf(s.tag))}</option>`).join("");
  if (!stats.some(s => s.tag === statColTag) && stats.length) { statColTag = stats[0].tag; el.value = statColTag; }
  el.oninput = () => { statColTag = el.value; renderTable(); };
}

async function load() {
  try {
    const res = await fetch("Schema.json?t=" + Date.now());
    if (!res.ok) throw new Error("Schema.json missing");
    schema = await res.json();
  } catch (e) {
    $("tableEmpty").style.display = "block";
    $("tableEmpty").innerHTML = "No item data in this repo yet.<br><br>In Unreal: run <b>Export Items</b> then <b>Upload to GitHub</b> from the Item Sync utility, then reload this page.";
    return;
  }
  for (const name of schema.categories || []) {
    try {
      const res = await fetch(`Items_${name}.json?t=` + Date.now());
      if (!res.ok) continue;
      const doc = await res.json();
      cats.push({ name, file: `Items_${name}.json`, doc, baseline: clone(doc.items || []) });
    } catch (e) { status("Could not load Items_" + name + ".json: " + e.message, true); }
  }
  try {
    const res = await fetch(WORKFLOW_FILE + "?t=" + Date.now());
    if (res.ok) {
      const w = await res.json();
      workflow = { flags: w.flags || {}, log: Array.isArray(w.log) ? w.log : [], notes: w.notes || {} };
    }
  } catch (e) { /* first run: no workflow file yet */ }

  const rf = $("rarityFilter");
  for (const r of schema.rarityTags || []) {
    const opt = document.createElement("option");
    opt.value = r; opt.textContent = leaf(r);
    rf.appendChild(opt);
  }
  renderStatColSelect();
  renderBulk();
  renderAll();
}

$("search").oninput = renderTable;
$("rarityFilter").oninput = renderTable;
$("sortBy").oninput = renderTable;
$("saveToken").onclick = () => { localStorage.setItem("irr_item_pat", $("token").value.trim()); status("Token stored in this browser."); };
$("token").value = localStorage.getItem("irr_item_pat") || "";
load();
</script>
