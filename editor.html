<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IRR — Item Database</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0f1214;
    --sidebar: #0b0e10;
    --panel: #14181b;
    --panel2: #191e22;
    --hover: #1d2327;
    --border: #232a30;
    --border-strong: #323b42;
    --text: #e8ebed;
    --dim: #8b949c;
    --faint: #5c656d;
    --accent: #c8f051;
    --accent-text: #10130a;
    --attention: #f0a04a;
    --changed: #c8f051;
    --danger: #e2695a;
    --t1: #9aa4ad; --t2: #6fd087; --t3: #57a8ff; --t4: #b57bff;
    --font-ui: "Inter", "Segoe UI", sans-serif;
    --font-mono: "IBM Plex Mono", Consolas, monospace;
    --radius: 6px;
  }
  * { box-sizing: border-box; }
  html { color-scheme: dark; }
  body { margin: 0; font-family: var(--font-ui); background: var(--bg); color: var(--text); font-size: 13px; overflow: hidden; }
  ::placeholder { color: var(--faint); opacity: 1; }

  /* ---- header ---- */
  header {
    display: flex; align-items: center; gap: 12px; padding: 0 16px; height: 54px;
    background: var(--sidebar); border-bottom: 1px solid var(--border);
  }
  .logo { display: flex; align-items: center; gap: 10px; }
  .logo .mark {
    width: 30px; height: 30px; border-radius: 7px; background: var(--accent); color: var(--accent-text);
    display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 11px; letter-spacing: 0.5px;
  }
  .logo .t1 { font-weight: 700; font-size: 13px; letter-spacing: 1.5px; }
  .logo .t2 { color: var(--dim); font-size: 10px; letter-spacing: 2px; text-transform: uppercase; margin-top: 1px; }
  header .spacer { flex: 1; }
  header input#token { width: 260px; }

  /* ---- generic controls ---- */
  input[type=text], input[type=number], input[type=password], textarea, select {
    background: #0d1013; color: var(--text); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 7px 10px; font-size: 13px; font-family: var(--font-ui); width: 100%;
  }
  input[type=number] { font-family: var(--font-mono); font-size: 12.5px; }
  input:focus, textarea:focus, select:focus { outline: none; border-color: var(--accent); }
  input[readonly] { color: var(--dim); background: transparent; cursor: default; }
  input.invalid { border-color: var(--danger); }
  textarea { min-height: 110px; resize: vertical; line-height: 1.5; }
  button {
    background: var(--panel2); color: var(--text); border: 1px solid var(--border-strong); border-radius: var(--radius);
    padding: 7px 14px; font-size: 12.5px; cursor: pointer; font-family: var(--font-ui); font-weight: 600; white-space: nowrap;
  }
  button:hover { border-color: var(--accent); color: var(--accent); }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
  button.primary:hover { filter: brightness(1.08); color: var(--accent-text); }
  button.ghost { background: transparent; }
  button.danger { color: var(--danger); border-color: var(--danger); }
  button.small { padding: 4px 10px; font-size: 11.5px; }
  label { display: block; font-size: 10.5px; color: var(--dim); margin: 12px 0 4px; text-transform: uppercase; letter-spacing: 1.2px; font-weight: 600; }
  small.hint { color: var(--faint); text-transform: none; letter-spacing: 0; font-weight: 400; }
  .badge { display: inline-flex; align-items: center; justify-content: center; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; font-size: 10.5px; font-weight: 700; }
  .badge.attn { background: rgba(240, 160, 74, 0.18); color: var(--attention); }
  .badge.chg { background: rgba(200, 240, 81, 0.15); color: var(--accent); }

  /* ---- layout ---- */
  main { display: flex; height: calc(100vh - 54px); }
  #sidebar { width: 212px; flex-shrink: 0; background: var(--sidebar); border-right: 1px solid var(--border); overflow-y: auto; padding: 12px 10px; }
  #content { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  #panel { width: 440px; flex-shrink: 0; background: var(--panel); border-left: 1px solid var(--border); display: none; flex-direction: column; }
  #panel.open { display: flex; }

  /* ---- sidebar ---- */
  .side-h { font-size: 10px; color: var(--faint); letter-spacing: 2px; text-transform: uppercase; font-weight: 700; margin: 14px 6px 6px; }
  .side-item {
    display: flex; align-items: center; gap: 8px; padding: 6px 9px; border-radius: var(--radius);
    cursor: pointer; color: var(--dim); font-weight: 500; margin-bottom: 1px;
  }
  .side-item:hover { background: var(--hover); color: var(--text); }
  .side-item.active { background: var(--panel2); color: var(--text); }
  .side-item.active .nm { color: var(--accent); }
  .side-item .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .side-item .ct { color: var(--faint); font-size: 11px; font-family: var(--font-mono); }

  /* ---- content toolbar ---- */
  #toolbar { padding: 12px 16px 8px; border-bottom: 1px solid var(--border); background: var(--bg); }
  #toolbar .trow { display: flex; gap: 8px; align-items: center; }
  #toolbar input#search { flex: 1; min-width: 120px; }
  #toolbar select { width: auto; }
  #countline { color: var(--faint); font-size: 11.5px; margin-top: 8px; }
  #bulkPanel { display: none; margin-top: 10px; padding: 10px; background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); }
  #bulkPanel.open { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  #bulkPanel select, #bulkPanel input { width: auto; }
  #bulkPanel .note { color: var(--faint); font-size: 11px; flex-basis: 100%; }

  /* ---- table ---- */
  #tableWrap { flex: 1; overflow-y: auto; }
  table#items { width: 100%; border-collapse: collapse; }
  table#items th {
    position: sticky; top: 0; background: var(--bg); z-index: 1; text-align: left;
    font-size: 10px; color: var(--faint); letter-spacing: 1.5px; text-transform: uppercase; font-weight: 700;
    padding: 8px 10px; border-bottom: 1px solid var(--border);
  }
  table#items td { padding: 7px 10px; border-bottom: 1px solid var(--border); vertical-align: middle; }
  table#items tr.irow { cursor: pointer; }
  table#items tr.irow:hover td { background: var(--hover); }
  table#items tr.irow.active td { background: var(--panel2); }
  .cell-item { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .avatar {
    width: 32px; height: 32px; border-radius: var(--radius); background: var(--panel2); border: 1px solid var(--border);
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    font-family: var(--font-mono); font-size: 10px; font-weight: 600; color: var(--dim);
  }
  .cell-item .nm { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .cell-item .tg { color: var(--faint); font-size: 10.5px; font-family: var(--font-mono); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; direction: rtl; text-align: left; }
  .cell-item > div { min-width: 0; }
  td.c-cat { color: var(--dim); }
  td.c-num { font-family: var(--font-mono); font-size: 12px; text-align: right; white-space: nowrap; }
  td.c-upd { color: var(--faint); font-size: 11.5px; white-space: nowrap; }
  .rchip { display: inline-flex; align-items: center; gap: 6px; font-size: 11.5px; font-weight: 600; white-space: nowrap; }
  .rchip .dot { width: 7px; height: 7px; border-radius: 50%; }
  .stat-badges { display: flex; gap: 6px; }
  .sb { font-size: 10px; font-weight: 700; letter-spacing: 0.8px; text-transform: uppercase; padding: 2px 7px; border-radius: 9px; white-space: nowrap; }
  .sb.edited { background: rgba(200, 240, 81, 0.14); color: var(--accent); }
  .sb.attn { background: rgba(240, 160, 74, 0.16); color: var(--attention); }
  .empty { color: var(--dim); padding: 40px 20px; line-height: 1.7; text-align: center; }

  /* ---- detail panel ---- */
  #panelHead { padding: 14px 16px 0; }
  #panelHead .top { display: flex; align-items: flex-start; gap: 12px; }
  #panelHead .avatar { width: 44px; height: 44px; font-size: 12px; }
  #panelHead .nm { font-size: 16px; font-weight: 700; line-height: 1.2; }
  #panelHead .tg { color: var(--faint); font-size: 10.5px; font-family: var(--font-mono); word-break: break-all; margin-top: 2px; }
  #panelHead .meta { margin-top: 5px; display: flex; gap: 10px; align-items: center; }
  #panelHead .close { margin-left: auto; cursor: pointer; color: var(--dim); font-size: 16px; padding: 2px 6px; border-radius: var(--radius); }
  #panelHead .close:hover { color: var(--text); background: var(--hover); }
  #tabs { display: flex; gap: 2px; margin-top: 14px; border-bottom: 1px solid var(--border); }
  .tab { padding: 8px 14px; cursor: pointer; color: var(--dim); font-weight: 600; font-size: 12.5px; border-bottom: 2px solid transparent; display: flex; gap: 6px; align-items: center; }
  .tab:hover { color: var(--text); }
  .tab.active { color: var(--text); border-bottom-color: var(--accent); }
  #panelBody { flex: 1; overflow-y: auto; padding: 4px 16px 16px; }
  #panelFoot { padding: 10px 16px; border-top: 1px solid var(--border); display: flex; gap: 8px; align-items: center; background: var(--panel); }
  #panelFoot .spacer { flex: 1; }
  .sec { font-size: 10px; color: var(--faint); letter-spacing: 2px; text-transform: uppercase; font-weight: 700; margin: 18px 0 2px; padding-bottom: 5px; border-bottom: 1px solid var(--border); }
  .row2 { display: flex; gap: 10px; }
  .row2 > div { flex: 1; min-width: 0; }
  table.stats { width: 100%; border-collapse: collapse; margin-top: 8px; }
  table.stats td { padding: 3px 6px 3px 0; vertical-align: middle; }
  table.stats td.sname { width: 42%; color: var(--dim); font-size: 12px; }
  table.stats td.sname .unit { color: var(--faint); font-size: 10px; }
  table.stats td.sval { width: 31%; }
  table.stats td.smod { width: 27%; }
  table.stats select { padding: 5px 6px; font-size: 12px; }
  table.stats input { padding: 5px 8px; }
  table.stats tr.modified td.sname { color: var(--changed); }

  /* relations / history */
  .rel-item { display: flex; align-items: center; gap: 9px; padding: 6px 8px; border-radius: var(--radius); cursor: pointer; }
  .rel-item:hover { background: var(--hover); }
  .rel-item .avatar { width: 26px; height: 26px; font-size: 9px; }
  .rel-item .nm { font-weight: 600; font-size: 12.5px; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .rel-item .cat { color: var(--faint); font-size: 11px; }
  .tagchips { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 8px; }
  .tagchip { font-family: var(--font-mono); font-size: 10.5px; color: var(--dim); background: var(--panel2); border: 1px solid var(--border); border-radius: 4px; padding: 2px 7px; }
  .hist { border-left: 2px solid var(--border); margin: 10px 0 0 6px; padding-left: 14px; }
  .hist-e { margin-bottom: 14px; }
  .hist-e .when { color: var(--faint); font-size: 11px; }
  .hist-e .who { color: var(--dim); font-weight: 600; font-size: 11px; }
  .hist-e .lines { margin-top: 3px; font-family: var(--font-mono); font-size: 11.5px; line-height: 1.6; }
  .attn-box { margin-top: 12px; padding: 9px 11px; background: rgba(240, 160, 74, 0.08); border: 1px solid rgba(240, 160, 74, 0.35); border-radius: var(--radius); font-size: 12px; }
  .attn-box .r { color: var(--attention); }

  /* ---- changes overlay ---- */
  #overlay { position: fixed; inset: 0; background: rgba(5, 7, 8, 0.72); display: none; z-index: 20; }
  #overlay.open { display: flex; align-items: center; justify-content: center; }
  #overlayCard { width: 640px; max-height: 82vh; background: var(--panel); border: 1px solid var(--border-strong); border-radius: 10px; display: flex; flex-direction: column; }
  #overlayCard .oh { display: flex; align-items: center; padding: 14px 18px; border-bottom: 1px solid var(--border); font-weight: 700; }
  #overlayCard .oh .close { margin-left: auto; cursor: pointer; color: var(--dim); padding: 2px 8px; }
  #overlayCard .oh .close:hover { color: var(--text); }
  #diffs { flex: 1; overflow-y: auto; padding: 12px 18px; }
  .diff-item { margin-bottom: 12px; border: 1px solid var(--border); border-radius: var(--radius); padding: 9px 12px; background: var(--panel2); }
  .diff-item .dname { font-weight: 700; cursor: pointer; }
  .diff-item .dname:hover { color: var(--accent); }
  .diff-item .dline { font-size: 12px; margin-top: 3px; font-family: var(--font-mono); }
  .diff-item .old { color: var(--danger); }
  .diff-item .new { color: var(--changed); }
  #overlayCard .of { display: flex; gap: 8px; padding: 12px 18px; border-top: 1px solid var(--border); }
  #overlayCard .of .spacer { flex: 1; }

  #status {
    position: fixed; bottom: 16px; right: 16px; padding: 10px 16px; border-radius: var(--radius);
    background: var(--panel2); border: 1px solid var(--border); display: none;
    max-width: 460px; font-size: 12px; font-family: var(--font-mono); white-space: pre-wrap; z-index: 30;
  }
  #status.ok { border-color: var(--accent); }
  #status.err { border-color: var(--danger); }
</style>
</head>
<body>
<header>
  <div class="logo">
    <div class="mark">IRR</div>
    <div><div class="t1">ITEM DATABASE</div><div class="t2">Content Operations</div></div>
  </div>
  <div class="spacer"></div>
  <button id="validateBtn">✓ Validate all</button>
  <button id="changesBtn">Changes <span class="badge chg" id="changesBadge">0</span></button>
  <input type="password" id="token" placeholder="GitHub token" title="Personal access token with read/write Contents on this repo. Stored only in this browser.">
  <button id="saveToken" class="ghost">Remember</button>
</header>
<main>
  <div id="sidebar">
    <div class="side-h">Workspace</div>
    <div id="views"></div>
    <div class="side-h">Categories</div>
    <div id="catList"></div>
  </div>

  <div id="content">
    <div id="toolbar">
      <div class="trow">
        <input type="text" id="search" placeholder="Search name, tag or description…">
        <select id="rarityFilter"><option value="All">All rarities</option></select>
        <select id="sortBy">
          <option value="name">Sort: Name</option>
          <option value="category">Sort: Category</option>
          <option value="rarity">Sort: Rarity</option>
          <option value="priceAsc">Sort: Price ↑</option>
          <option value="priceDesc">Sort: Price ↓</option>
          <option value="updated">Sort: Updated</option>
        </select>
        <button id="bulkToggle" class="ghost">Bulk edit</button>
      </div>
      <div id="bulkPanel">
        <select id="bulkStat"></select>
        <select id="bulkOp">
          <option value="mul">Multiply by</option>
          <option value="add">Add</option>
          <option value="set">Set to</option>
        </select>
        <input type="number" id="bulkVal" step="any" placeholder="value" style="width:110px">
        <button id="bulkBtn" class="small">Apply to filtered</button>
        <div class="note">Applies to every listed item that has the chosen stat. Review in Changes before saving.</div>
      </div>
      <div id="countline"></div>
    </div>
    <div id="tableWrap">
      <table id="items">
        <thead><tr>
          <th style="width:34%">Item</th><th>Category</th><th>Rarity</th>
          <th style="text-align:right">Price</th><th style="text-align:right">Weight</th>
          <th>Updated</th><th>Status</th>
        </tr></thead>
        <tbody id="rows"></tbody>
      </table>
      <div id="tableEmpty" class="empty" style="display:none"></div>
    </div>
  </div>

  <div id="panel">
    <div id="panelHead"></div>
    <div id="panelBody"></div>
    <div id="panelFoot">
      <button id="discardItemBtn" class="danger ghost small">Discard</button>
      <button id="attnBtn" class="ghost small">⚠ Needs attention</button>
      <div class="spacer"></div>
      <button id="saveBtn" class="primary">Save changes</button>
    </div>
  </div>
</main>

<div id="overlay">
  <div id="overlayCard">
    <div class="oh">Pending changes<span class="close" id="overlayClose">✕</span></div>
    <div id="diffs"></div>
    <div class="of">
      <button id="revertAllBtn" class="danger ghost">Revert all</button>
      <button id="draftBtn" class="ghost">Copy patch-note draft</button>
      <div class="spacer"></div>
      <button id="commitBtn" class="primary">Commit to GitHub</button>
    </div>
  </div>
</div>
<div id="status"></div>

<script>
const OWNER = "pompeiic", REPO = "irr-item-editor", BRANCH = "main";
const WORKFLOW_FILE = "Workflow.json";

let schema = null;
let cats = [];              // {name, file, doc, baseline}
let workflow = { flags: {}, log: [] };
let workflowDirty = false;
let sel = null;             // {c, i}
let activeTab = "overview";
let view = "all";           // all | recent | attention | cat:<Name>
let ghUser = null;

const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
const leaf = t => { const s = String(t ?? ""); const i = s.lastIndexOf("."); return i >= 0 ? s.slice(i + 1) : s; };
const fmt = v => Number.isFinite(v) ? String(Math.round(v * 10000) / 10000) : String(v);
const clone = o => JSON.parse(JSON.stringify(o));

function status(msg, isErr) {
  const el = $("status");
  el.textContent = msg;
  el.className = isErr ? "err" : "ok";
  el.style.display = "block";
  clearTimeout(el._t);
  el._t = setTimeout(() => el.style.display = "none", 6000);
  return !isErr;
}
function relTime(iso) {
  if (!iso) return "—";
  const s = (Date.now() - new Date(iso).getTime()) / 1000;
  if (!Number.isFinite(s) || s < 0) return "—";
  if (s < 60) return "just now";
  if (s < 3600) return Math.floor(s / 60) + "m ago";
  if (s < 86400) return Math.floor(s / 3600) + "h ago";
  if (s < 86400 * 30) return Math.floor(s / 86400) + "d ago";
  return new Date(iso).toLocaleDateString();
}
const RARITY_COLORS = { "Tier 1": "var(--t1)", "Tier 2": "var(--t2)", "Tier 3": "var(--t3)", "Tier 4": "var(--t4)" };
function rarityChip(tag) {
  if (!tag || tag === "None") return `<span class="rchip" style="color:var(--faint)"><span class="dot" style="background:var(--faint)"></span>None</span>`;
  const l = leaf(tag);
  const col = RARITY_COLORS[l] || "var(--dim)";
  return `<span class="rchip" style="color:${col}"><span class="dot" style="background:${col}"></span>${esc(l)}</span>`;
}
function avatarText(it) {
  const a = (it.abbreviation || it.name || leaf(it.itemTag) || "?").trim();
  return esc(a.slice(0, 4).toUpperCase());
}
function statDesc(tag) { return (schema?.stats || []).find(s => s.tag === tag); }
function statLabel(tag) { const d = statDesc(tag); return (d && d.displayName) ? d.displayName : leaf(tag); }
function findStat(it, tag) { return (it.stats || []).find(x => x.tag === tag && x.modifyType !== "None"); }
function allEntries() {
  const out = [];
  for (const c of cats) (c.doc.items || []).forEach((it, i) => out.push({ c, i, item: it }));
  return out;
}
function tagMatches(itemTag, supportTag) { return itemTag === supportTag || String(itemTag).startsWith(supportTag + "."); }

// ---- workflow (flags + edit log) ---------------------------------------------------------------

function flagOf(tag) { return workflow.flags?.[tag]; }
function hasAttention(tag) {
  const f = flagOf(tag);
  return !!(f && (f.manual || (f.validation || []).length));
}
function lastEditOf(tag) {
  for (let i = workflow.log.length - 1; i >= 0; i--) if (workflow.log[i].tag === tag) return workflow.log[i];
  return null;
}
function setManualAttention(tag, on) {
  const f = workflow.flags[tag] || (workflow.flags[tag] = { validation: [] });
  f.manual = on;
  f.time = new Date().toISOString();
  if (!on && !(f.validation || []).length) delete workflow.flags[tag];
  workflowDirty = true;
}

// ---- validation ---------------------------------------------------------------------------------

const VALIDATION_RULES = [
  { id: "name", check: it => !String(it.name || "").trim() ? "Name is empty"
      : /template/i.test(it.name) ? "Name contains placeholder text" : null },
  { id: "description", check: it => !String(it.description || "").trim() ? "Description is empty"
      : /template/i.test(it.description) ? "Description contains placeholder text"
      : String(it.description).trim().length < 15 ? "Description is very short" : null },
  { id: "abbreviation", check: it => !String(it.abbreviation || "").trim() ? "Abbreviation is empty"
      : String(it.abbreviation).length > 12 ? "Abbreviation longer than 12 characters" : null },
  { id: "price", check: it => it.vendor?.bHasVendorRow && it.vendor.defaultMarketPrice === 0 ? "Sold item with price 0" : null },
  { id: "rarity", check: it => it.vendor?.bHasVendorRow && (!it.vendor.rarityTag || it.vendor.rarityTag === "None") ? "No rarity set" : null },
];

function validateAll() {
  let flagged = 0;
  for (const e of allEntries()) {
    const reasons = VALIDATION_RULES.map(r => r.check(e.item)).filter(Boolean);
    const f = flagOf(e.item.itemTag);
    if (reasons.length) {
      const nf = f || (workflow.flags[e.item.itemTag] = {});
      nf.validation = reasons;
      nf.time = new Date().toISOString();
      flagged++;
    } else if (f) {
      f.validation = [];
      if (!f.manual) delete workflow.flags[e.item.itemTag];
    }
  }
  workflowDirty = true;
  renderAll();
  status(`Validation: ${flagged} item(s) need attention. Flags are saved with the next commit.`);
}

// ---- diffing ------------------------------------------------------------------------------------

function entryDiff(base, cur) {
  if (!base) return [];
  const lines = [];
  const txt = (label, a, b) => { if ((a ?? "") !== (b ?? "")) lines.push({ label, old: a, new: b, text: label === "Description" }); };
  txt("Name", base.name, cur.name);
  txt("Abbreviation", base.abbreviation, cur.abbreviation);
  txt("Description", base.description, cur.description);
  const bs = base.stats || [], cs = cur.stats || [];
  for (let i = 0; i < Math.min(bs.length, cs.length); i++) {
    if (bs[i].value !== cs[i].value) lines.push({ label: statLabel(cs[i].tag), old: fmt(bs[i].value), new: fmt(cs[i].value) });
    if (bs[i].modifyType !== cs[i].modifyType) lines.push({ label: statLabel(cs[i].tag) + " modify", old: bs[i].modifyType, new: cs[i].modifyType });
  }
  if ((base.maxStack ?? null) !== (cur.maxStack ?? null)) lines.push({ label: "Max stack", old: String(base.maxStack), new: String(cur.maxStack) });
  if (base.vendor && cur.vendor && base.vendor.bHasVendorRow) {
    const v = (label, a, b, isTag) => { if (a !== b) lines.push({ label, old: isTag ? leaf(a) : fmt(a), new: isTag ? leaf(b) : fmt(b) }); };
    v("Rarity", base.vendor.rarityTag, cur.vendor.rarityTag, true);
    v("Faction", base.vendor.factionTag, cur.vendor.factionTag, true);
    v("Price", base.vendor.defaultMarketPrice, cur.vendor.defaultMarketPrice);
    v("Black market", base.vendor.blackMarketPrice, cur.vendor.blackMarketPrice);
  }
  return lines;
}
function catChanges(c) {
  const out = [];
  (c.doc.items || []).forEach((it, i) => {
    const lines = entryDiff(c.baseline[i], it);
    if (lines.length) out.push({ c, i, item: it, lines });
  });
  return out;
}
function allChanges() { return cats.flatMap(catChanges); }

// ---- filtering / sorting ------------------------------------------------------------------------

function visibleEntries() {
  const q = $("search").value.trim().toLowerCase();
  const rarity = $("rarityFilter").value;
  let out = allEntries();

  if (view === "attention") out = out.filter(e => hasAttention(e.item.itemTag));
  else if (view === "recent") {
    const seen = new Map();
    workflow.log.forEach(l => seen.set(l.tag, l.time));
    allChanges().forEach(ch => seen.set(ch.item.itemTag, "9999")); // unsaved edits float to top
    out = out.filter(e => seen.has(e.item.itemTag));
    out.sort((a, b) => String(seen.get(b.item.itemTag)).localeCompare(String(seen.get(a.item.itemTag))));
  }
  else if (view.startsWith("cat:")) { const c = view.slice(4); out = out.filter(e => e.c.name === c); }

  if (q) out = out.filter(e =>
    String(e.item.name).toLowerCase().includes(q) ||
    String(e.item.itemTag).toLowerCase().includes(q) ||
    String(e.item.description || "").toLowerCase().includes(q));
  if (rarity !== "All") out = out.filter(e => e.item.vendor?.rarityTag === rarity);

  if (view !== "recent") {
    const sort = $("sortBy").value;
    const nameOf = e => String(e.item.name || leaf(e.item.itemTag)).toLowerCase();
    const rarityOf = e => e.item.vendor?.bHasVendorRow && e.item.vendor.rarityTag !== "None" ? leaf(e.item.vendor.rarityTag) : "\uffff";
    const priceOf = e => e.item.vendor?.bHasVendorRow ? e.item.vendor.defaultMarketPrice : -1;
    const updOf = e => lastEditOf(e.item.itemTag)?.time || "";
    out.sort((a, b) => {
      if (sort === "category") return a.c.name.localeCompare(b.c.name) || nameOf(a).localeCompare(nameOf(b));
      if (sort === "rarity") return rarityOf(a).localeCompare(rarityOf(b)) || nameOf(a).localeCompare(nameOf(b));
      if (sort === "priceAsc") return priceOf(a) - priceOf(b) || nameOf(a).localeCompare(nameOf(b));
      if (sort === "priceDesc") return priceOf(b) - priceOf(a) || nameOf(a).localeCompare(nameOf(b));
      if (sort === "updated") return updOf(b).localeCompare(updOf(a)) || nameOf(a).localeCompare(nameOf(b));
      return nameOf(a).localeCompare(nameOf(b));
    });
  }
  return out;
}

// ---- sidebar ------------------------------------------------------------------------------------

function renderSidebar() {

  $("views").innerHTML = views.map(v =>

  $("catList").innerHTML = cats.map(c =>
    `<div class="side-item${view === "cat:" + c.name ? " active" : ""}" data-view="cat:${esc(c.name)}"><span class="nm">${esc(c.name)}</span><span class="ct">${(c.doc.items || []).length}</span></div>`).join("");
  document.querySelectorAll(".side-item").forEach(el => el.onclick = () => { view = el.dataset.view; renderAll(); });

// ---- table --------------------------------------------------------------------------------------

function renderTable() {
  const entries = visibleEntries();
  const changes = allChanges();
  $("changesBadge").textContent = changes.length;
  $("countline").textContent = `${entries.length} of ${allEntries().length} items` + (changes.length ? ` · ${changes.length} with unsaved changes` : "");

  const tb = $("rows");

  $("tableEmpty").textContent = "No items match.";
  for (const e of entries) {

    const attn = hasAttention(it.itemTag);

        `<div class="nm">${esc(it.name || leaf(it.itemTag))}</div>` +
        `<div class="tg" title="${esc(it.itemTag)}">${esc(it.itemTag)}</div></div></div></td>` +
      `<td class="c-cat">${esc(e.c.name)}</td>` +
      `<td>${rarityChip(it.vendor?.bHasVendorRow ? it.vendor.rarityTag : null)}</td>` +
      `<td class="c-num">${esc(price)}</td>` +
      `<td class="c-num">${w ? esc(fmt(w.value)) + " kg" : "—"}</td>` +
      `<td class="c-upd">${changed ? "unsaved" : relTime(last?.time)}</td>` +
      `<td><div class="stat-badges">${changed ? '<span class="sb edited">Edited</span>' : ""}${attn ? '<span class="sb attn">Attention</span>' : ""}</div></td>`;
    tr.onclick = () => { sel = { c: e.c, i: e.i }; activeTab = activeTab || "overview"; renderPanel(); renderTable(); };

// ---- detail panel -------------------------------------------------------------------------------

function tagSelect(id, options, current) {
  const opts = [...new Set(["None", ...(options || []), current].filter(Boolean))];
  return `<select id="${id}">` + opts.map(o => `<option value="${esc(o)}"${o === current ? " selected" : ""}>${esc(o === "None" ? "None" : leaf(o))}</option>`).join("") + `</select>`;
}

function renderPanel() {
  const panel = $("panel");
  if (!sel) { panel.classList.remove("open"); return; }
  panel.classList.add("open");
  const it = sel.c.doc.items[sel.i];

  const relCount = relationCounts(it);
  $("panelHead").innerHTML =
    `<div class="top"><div class="avatar">${avatarText(it)}</div><div style="min-width:0;flex:1">` +
      `<div class="nm">${esc(it.name || leaf(it.itemTag))}</div>` +
      `<div class="tg">${esc(it.itemTag)}</div>` +
      `<div class="meta">${rarityChip(it.vendor?.bHasVendorRow ? it.vendor.rarityTag : null)}<span style="color:var(--faint);font-size:11px">${esc(sel.c.name)}</span></div>` +
    `</div><span class="close" id="panelClose">✕</span></div>` +
    `<div id="tabs">` +
      `<div class="tab${activeTab === "overview" ? " active" : ""}" data-tab="overview">Overview</div>` +
      `<div class="tab${activeTab === "relations" ? " active" : ""}" data-tab="relations">Relations${relCount ? ` <span class="badge chg">${relCount}</span>` : ""}</div>` +
      `<div class="tab${activeTab === "history" ? " active" : ""}" data-tab="history">History</div>` +
    `</div>`;
  $("panelClose").onclick = () => { sel = null; renderPanel(); renderTable(); };
  document.querySelectorAll(".tab").forEach(el => el.onclick = () => { activeTab = el.dataset.tab; renderPanel(); });

  if (activeTab === "overview") renderOverview(it);
  else if (activeTab === "relations") renderRelations(it);
  else renderHistory(it);

  const f = flagOf(it.itemTag);
  $("attnBtn").style.color = f?.manual ? "var(--attention)" : "";
  $("attnBtn").style.borderColor = f?.manual ? "var(--attention)" : "";

function renderOverview(it) {
  const modifyTypes = (schema?.modifyTypes || ["None", "Base", "Add", "Multiply"]).filter(m => m !== "None");
  let html = "";

  const f = flagOf(it.itemTag);
  if (f && (f.validation || []).length)
    html += `<div class="attn-box"><b class="r">⚠ Needs attention</b><br>${f.validation.map(esc).join("<br>")}</div>`;

  html += `<div class="sec">Identity</div>`;
  html += `<label>Item tag — read-only</label><input type="text" readonly value="${esc(it.itemTag)}">`;
  html += `<div class="row2"><div><label>Vendor row — read-only</label><input type="text" readonly value="${esc(it.vendor?.bHasVendorRow ? it.vendor.rowName : "(none)")}"></div>` +
          `<div><label>Asset — read-only</label><input type="text" readonly title="${esc(it.assetPath)}" value="${esc(String(it.assetPath || "").split("/").pop())}"></div></div>`;

  html += `<div class="sec">Text</div>`;
  html += `<label>Display name</label><input type="text" id="fName" value="${esc(it.name)}">`;
  html += `<label>Abbreviation — <small class="hint">inventory tile, keep short</small></label><input type="text" id="fAbbr" maxlength="24" value="${esc(it.abbreviation)}">`;
  html += `<label>Description</label><textarea id="fDesc">${esc(it.description)}</textarea>`;

  html += `<div class="sec">Quick balance</div>`;
  if (it.vendor?.bHasVendorRow) {
    html += `<div class="row2"><div><label>Price — <small class="hint">-1 = not sold</small></label><input type="number" step="any" id="fPrice" value="${esc(it.vendor.defaultMarketPrice)}"></div>` +
            `<div><label>Black market — <small class="hint">-1 = not sold</small></label><input type="number" step="any" id="fBlackPrice" value="${esc(it.vendor.blackMarketPrice)}"></div></div>`;
    html += `<div class="row2"><div><label>Rarity</label>${tagSelect("fRarity", schema?.rarityTags, it.vendor.rarityTag)}</div>` +
            `<div><label>Faction</label>${tagSelect("fFaction", schema?.factionTags, it.vendor.factionTag)}</div></div>`;
  }
  const stackHint = it.bCanStack === false ? ` — <small class="hint">item is not stackable</small>` : "";
  html += `<div class="row2"><div><label>Max stack${stackHint}</label><input type="number" step="1" id="fMaxStack" value="${esc(it.maxStack ?? "")}"${it.maxStack === undefined ? " readonly" : ""}></div><div></div></div>`;

  html += `<div class="sec">Stats</div>`;
  const editableStats = (it.stats || []).map((s, si) => ({ s, si })).filter(x => x.s.modifyType !== "None");
  if (!editableStats.length) html += `<div class="empty" style="padding:16px">No editable stats.</div>`;
  else {
    html += `<table class="stats">`;
    for (const { s, si } of editableStats) {
      const d = statDesc(s.tag);
      const b = sel.c.baseline[sel.i].stats[si];
      const changed = b && (b.value !== s.value || b.modifyType !== s.modifyType);
      html += `<tr class="${changed ? "modified" : ""}" title="${esc(s.tag)}">` +
        `<td class="sname">${esc(statLabel(s.tag))}${d?.unit ? ` <span class="unit">[${esc(d.unit)}]</span>` : ""}</td>` +
        `<td class="sval"><input type="number" step="any" data-stat="${si}" data-field="value" value="${esc(s.value)}"></td>` +
        `<td class="smod"><select data-stat="${si}" data-field="modifyType">` +
          modifyTypes.map(m => `<option value="${esc(m)}"${m === s.modifyType ? " selected" : ""}>${esc(m)}</option>`).join("") +
        `</select></td></tr>`;
    }
    html += `</table>`;
  }
  $("panelBody").innerHTML = html;

  // wiring
  const num = inp => { const v = parseFloat(inp.value); inp.classList.toggle("invalid", !Number.isFinite(v)); return v; };
  $("fName").oninput = e => { it.name = e.target.value; onEdit(); };
  $("fAbbr").oninput = e => { it.abbreviation = e.target.value; onEdit(); };
  $("fDesc").oninput = e => { it.description = e.target.value; onEdit(); };
  if (it.maxStack !== undefined) $("fMaxStack").oninput = e => { const v = parseInt(e.target.value, 10); if (Number.isFinite(v) && v >= 1) it.maxStack = v; onEdit(); };
  document.querySelectorAll("#panelBody [data-stat]").forEach(inp => inp.oninput = e => {
    const s = it.stats[+e.target.dataset.stat];

    $("fPrice").oninput = e => { const v = num(e.target); if (Number.isFinite(v)) it.vendor.defaultMarketPrice = v; onEdit(); };
    $("fBlackPrice").oninput = e => { const v = num(e.target); if (Number.isFinite(v)) it.vendor.blackMarketPrice = v; onEdit(); };
  }
}

function relationCounts(it) {
  const accepts = allEntries().filter(e => e.item !== it && (it.supportedItemTags || []).some(t => tagMatches(e.item.itemTag, t)));
  const fits = allEntries().filter(e => e.item !== it && (e.item.supportedItemTags || []).some(t => tagMatches(it.itemTag, t)));
  return accepts.length + fits.length;
}

function relList(entries, cap) {
  if (!entries.length) return `<div class="empty" style="padding:12px">None.</div>`;
  let html = entries.slice(0, cap).map(e =>
    `<div class="rel-item" data-tag="${esc(e.item.itemTag)}"><div class="avatar">${avatarText(e.item)}</div>` +
    `<span class="nm">${esc(e.item.name || leaf(e.item.itemTag))}</span><span class="cat">${esc(e.c.name)}</span></div>`).join("");
  if (entries.length > cap) html += `<div class="empty" style="padding:8px">+ ${entries.length - cap} more…</div>`;
  return html;
}

function renderRelations(it) {
  const accepts = allEntries().filter(e => e.item !== it && (it.supportedItemTags || []).some(t => tagMatches(e.item.itemTag, t)));
  const fits = allEntries().filter(e => e.item !== it && (e.item.supportedItemTags || []).some(t => tagMatches(it.itemTag, t)));
  let html = "";
  html += `<div class="sec">Accepts (${accepts.length}) — <small class="hint">items this item's containers support</small></div>`;
  html += relList(accepts, 60);
  if ((it.supportedItemTags || []).length)
    html += `<div class="tagchips">${it.supportedItemTags.map(t => `<span class="tagchip">${esc(t)}</span>`).join("")}</div>`;
  html += `<div class="sec">Fits into (${fits.length}) — <small class="hint">items whose containers support this item</small></div>`;
  html += relList(fits, 60);
  html += `<div class="empty" style="padding:14px;font-size:11.5px">Relations are read-only — container setup is edited in Unreal.</div>`;
  $("panelBody").innerHTML = html;
  document.querySelectorAll(".rel-item").forEach(el => el.onclick = () => {
    const t = el.dataset.tag;
    for (const e of allEntries()) if (e.item.itemTag === t) { sel = { c: e.c, i: e.i }; activeTab = "overview"; renderPanel(); renderTable(); return; }
  });
}

function renderHistory(it) {
  let html = "";
  const pending = entryDiff(sel.c.baseline[sel.i], it);
  if (pending.length) {
    html += `<div class="sec">Unsaved changes</div><div class="hist"><div class="hist-e"><div class="lines">` +
      pending.map(l => l.text ? `${esc(l.label)} <span class="new">updated</span>`
        : `${esc(l.label)} <span class="old">${esc(l.old)}</span> → <span class="new">${esc(l.new)}</span>`).join("<br>") +
      `</div></div></div>`;
  }
  const entries = workflow.log.filter(l => l.tag === it.itemTag).slice().reverse();
  html += `<div class="sec">History</div>`;
  if (!entries.length) html += `<div class="empty" style="padding:16px">No recorded edits yet.<br><small class="hint">History starts with the first commit made from this editor.</small></div>`;
  else {
    html += `<div class="hist">` + entries.map(l =>
      `<div class="hist-e"><span class="who">${esc(l.author || "unknown")}</span> <span class="when">· ${esc(relTime(l.time))} (${esc(new Date(l.time).toLocaleString())})</span>` +
      `<div class="lines">${(l.lines || []).map(esc).join("<br>")}</div></div>`).join("") + `</div>`;
  }
  $("panelBody").innerHTML = html;
}

};

async function ghFetchUser(headers) {
  if (ghUser) return ghUser;
  try {
    const res = await fetch("https://api.github.com/user", { headers });
    if (res.ok) ghUser = (await res.json()).login;
  } catch (e) { /* offline lookups just fall back */ }
  return ghUser || "unknown";
}

async function putFile(path, contentObj, headers, message) {
  const api = `https://api.github.com/repos/${OWNER}/${REPO}/contents/${path}`;
  const cur = await fetch(api + "?ref=" + BRANCH, { headers });
  let sha = undefined;
  if (cur.ok) sha = (await cur.json()).sha;
  else if (cur.status === 401) throw new Error("GitHub rejected the token (401) — expired or pasted incompletely.");
  else if (cur.status !== 404) throw new Error(path + ": fetching current file failed: " + cur.status);
  const body = {
    message,
    content: btoa(unescape(encodeURIComponent(JSON.stringify(contentObj, null, "\t")))),
    branch: BRANCH
  };
  if (sha) body.sha = sha;
  const put = await fetch(api, { method: "PUT", headers, body: JSON.stringify(body) });
  if (!put.ok) throw new Error(path + ": commit failed: " + put.status + " " + (await put.text()).slice(0, 200));
}

async function commit() {
  const dirty = cats.filter(c => catChanges(c).length);
  if (!dirty.length && !workflowDirty) return status("Nothing to save.", true);
  const token = $("token").value.trim();
  if (!token) return status("Paste a GitHub token first (top right).", true);
  const headers = { "Authorization": "Bearer " + token, "Accept": "application/vnd.github+json" };
  const author = await ghFetchUser(headers);
  let committed = 0;
  try {
    // Log entries reflect exactly what this commit changes.
    const now = new Date().toISOString();
    const newLog = allChanges().map(ch => ({
      tag: ch.item.itemTag, time: now, author,
      lines: ch.lines.map(l => l.text ? `${l.label} updated` : `${l.label} ${l.old} → ${l.new}`)
    }));

    for (const c of dirty) {
      await putFile(c.file, c.doc, headers, `Update ${c.file} (item editor)`);
      c.baseline = clone(c.doc.items);
      committed++;
    }
    if (newLog.length || workflowDirty) {
      workflow.log.push(...newLog);
      if (workflow.log.length > 5000) workflow.log = workflow.log.slice(-5000);
      await putFile(WORKFLOW_FILE, workflow, headers, "Update workflow (item editor)");
      workflowDirty = false;
    }
    renderAll();
    status(`Saved: ${committed} file(s) committed${newLog.length ? `, ${newLog.length} history entrie(s)` : ""}. Import in Unreal via Download + Import.`);
  } catch (e) {
    renderAll();
    status(e.message + (committed ? ` (${committed} file(s) already committed)` : ""), true);
  }
}
$("commitBtn").onclick = () => { commit(); closeOverlay(); };
$("saveBtn").onclick = commit;
$("validateBtn").onclick = validateAll;

// ---- load ---------------------------------------------------------------------------------------

function renderAll() { renderSidebar(); renderTable(); renderPanel(); }

async function load() {
  try {
    const res = await fetch("Schema.json?t=" + Date.now());
    if (!res.ok) throw new Error("Schema.json missing");
    schema = await res.json();
  } catch (e) {
    $("tableEmpty").style.display = "block";
    $("tableEmpty").innerHTML = "No item data in this repo yet.<br><br>In Unreal: run <b>Export Items</b> then <b>Upload to GitHub</b> from the Item Sync utility, then reload this page.";
    return;
  }
  for (const name of schema.categories || []) {
    try {
      const res = await fetch(`Items_${name}.json?t=` + Date.now());
      if (!res.ok) continue;
      const doc = await res.json();
      cats.push({ name, file: `Items_${name}.json`, doc, baseline: clone(doc.items || []) });
    } catch (e) { status("Could not load Items_" + name + ".json: " + e.message, true); }
  }
  try {
    const res = await fetch(WORKFLOW_FILE + "?t=" + Date.now());
    if (res.ok) {
      const w = await res.json();
      workflow = { flags: w.flags || {}, log: Array.isArray(w.log) ? w.log : [] };
    }
  } catch (e) { /* first run: no workflow file yet */ }

  const rf = $("rarityFilter");
  for (const r of schema.rarityTags || []) {
    const opt = document.createElement("option");
    opt.value = r; opt.textContent = leaf(r);
    rf.appendChild(opt);
  }
  renderBulk();
  renderAll();
}

$("search").oninput = renderTable;
$("rarityFilter").oninput = renderTable;
$("sortBy").oninput = renderTable;
$("saveToken").onclick = () => { localStorage.setItem("irr_item_pat", $("token").value.trim()); status("Token stored in this browser."); };
$("token").value = localStorage.getItem("irr_item_pat") || "";
load();
</script>
